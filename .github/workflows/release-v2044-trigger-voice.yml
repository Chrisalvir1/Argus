name: Release Argus v2.0.44 trigger voice
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v2044-trigger-voice.yml]
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Add trigger message to UI labels and bump release
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('custom_components/argus/config_flow.py');s=p.read_text(encoding='utf-8')
          s=s.replace('    CONF_ARMING_VOICE_MESSAGE_CANCELLED,\n    DEFAULT_ARMING_VOICE_MESSAGE_START,', '    CONF_ARMING_VOICE_MESSAGE_CANCELLED, CONF_ARMING_VOICE_MESSAGE_TRIGGERED,\n    DEFAULT_ARMING_VOICE_MESSAGE_START,',1)
          s=s.replace('    DEFAULT_ARMING_VOICE_MESSAGE_CANCELLED,\n)', '    DEFAULT_ARMING_VOICE_MESSAGE_CANCELLED, DEFAULT_ARMING_VOICE_MESSAGE_TRIGGERED,\n)',1)
          marker='            vol.Optional(CONF_ARMING_VOICE_MESSAGE_CANCELLED, default=values.get(CONF_ARMING_VOICE_MESSAGE_CANCELLED, DEFAULT_ARMING_VOICE_MESSAGE_CANCELLED)): selector.TextSelector(selector.TextSelectorConfig(multiline=True)),\n'
          if marker not in s: raise SystemExit('TTS UI insertion marker missing')
          s=s.replace(marker,marker+'            vol.Optional(CONF_ARMING_VOICE_MESSAGE_TRIGGERED, default=values.get(CONF_ARMING_VOICE_MESSAGE_TRIGGERED, DEFAULT_ARMING_VOICE_MESSAGE_TRIGGERED)): selector.TextSelector(selector.TextSelectorConfig(multiline=True)),\n',1)
          p.write_text(s,encoding='utf-8')
          labels={'strings.json':'Alarm-trigger sensor message','en.json':'Alarm-trigger sensor message','es.json':'Mensaje del sensor que disparó la alarma','fr.json':'Message du capteur ayant déclenché l’alarme','pt.json':'Mensagem do sensor que disparou o alarme','it.json':'Messaggio del sensore che ha attivato l’allarme','zh.json':'触发警报的传感器消息','ru.json':'Сообщение датчика, вызвавшего тревогу'}
          for name,label in labels.items():
              path=Path('custom_components/argus/strings.json') if name=='strings.json' else Path('custom_components/argus/translations')/name
              data=json.loads(path.read_text(encoding='utf-8'));data.setdefault('options',{}).setdefault('step',{}).setdefault('init',{}).setdefault('data',{})['arming_voice_message_triggered']=label
              path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          targets=[Path('custom_components/argus/manifest.json'),Path('custom_components/argus/const.py'),*Path('custom_components/argus/www').glob('*.js'),*Path('tests').glob('test_*.py')]
          for path in targets:path.write_text(path.read_text(encoding='utf-8').replace('2.0.43','2.0.44'),encoding='utf-8')
          PY
          rm -f .github/workflows/release-v2044-trigger-voice.yml
      - name: Verify backend, UI, YAML and sensor identity
        run: |
          python -m compileall -q custom_components/argus
          python -m unittest discover -s tests -v
          grep -q 'CONF_ARMING_VOICE_MESSAGE_TRIGGERED' custom_components/argus/config_flow.py
          grep -q 'message_triggered' custom_components/argus/__init__.py
          grep -q 'argus_alarm_triggered' custom_components/argus/arming_voice.py
          grep -q 'sensor_entity_id' custom_components/argus/arming_voice.py
          grep -q 'Mensaje del sensor que disparó la alarma' custom_components/argus/translations/es.json
      - name: Verify frontend remains intact
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
          for file in custom_components/argus/www/*.js custom_components/argus/www/react-dist/*.js; do node --check "$file"; done
          npm audit --omit=dev --audit-level=high
      - name: Package and publish verified release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          find custom_components/argus -type d -name __pycache__ -prune -exec rm -rf {} +
          find custom_components/argus -type f -name '*.pyc' -delete
          cd custom_components/argus && zip -qr ../../argus.zip . -x '__pycache__/*' '*/__pycache__/*' '*.pyc' && cd ../..
          unzip -t argus.zip
          test "$(unzip -p argus.zip manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = 2.0.44
          sha256sum argus.zip > argus.zip.sha256
          git config user.name Chrisalvir
          git config user.email chrisalvir01@gmail.com
          git add -A && git commit -m 'Release Argus Home Hub v2.0.44'
          git tag -a v2.0.44 -m 'Argus Home Hub v2.0.44'
          git push origin HEAD:main && git push origin v2.0.44
          gh release create v2.0.44 argus.zip argus.zip.sha256 --title 'Argus Home Hub v2.0.44' --notes-file docs/RELEASE_NOTES_2.0.44.md
