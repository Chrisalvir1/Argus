name: Finalize v2.0.38
on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-v2038.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('custom_components/argus/alarm_control_panel.py')
          s=p.read_text(encoding='utf-8')
          if 'cancelled_from_off' not in s:
              s=s.replace(
                  '    async def async_alarm_disarm(self, code=None) -> None:\n        user_id = await self._get_context_user()',
                  '    async def async_alarm_disarm(self, code=None) -> None:\n        # Off cancels a pending request without a PIN; the alarm is not armed yet.\n        if self._arm_request and self._alarm_state == AlarmControlPanelState.DISARMED:\n            await self._async_cancel_arming_request("cancelled_from_off", disarm=True)\n            return\n        user_id = await self._get_context_user()'
              )
          if 'had_request = self._arm_request is not None' not in s:
              s=s.replace(
                  '        if not self._arm_request and self._alarm_state != AlarmControlPanelState.ARMING:\n            return\n        self._cancel_timers()\n        if disarm and self._alarm_state == AlarmControlPanelState.ARMING:',
                  '        had_request = self._arm_request is not None\n        if not had_request and self._alarm_state != AlarmControlPanelState.ARMING:\n            return\n        self._cancel_timers()\n        if disarm and (had_request or self._alarm_state == AlarmControlPanelState.ARMING):'
              )
          assert 'cancelled_from_off' in s and 'had_request = self._arm_request is not None' in s
          p.write_text(s,encoding='utf-8')
          for path in [Path('custom_components/argus/const.py'),Path('custom_components/argus/manifest.json'),Path('custom_components/argus/www/argus-card.js'),Path('custom_components/argus/www/argus-bootstrap.js'),Path('custom_components/argus/www/argus-panel.js'),*Path('tests').glob('test_*.py')]:
              path.write_text(path.read_text(encoding='utf-8').replace('2.0.37','2.0.38'),encoding='utf-8')
          PY
          python -m compileall -q custom_components/argus
      - name: Release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          find custom_components/argus -type d -name __pycache__ -prune -exec rm -rf {} +
          find custom_components/argus -type f -name '*.pyc' -delete
          cd custom_components/argus && zip -qr ../../argus.zip . -x '__pycache__/*' '*/__pycache__/*' '*.pyc' && cd ../..
          unzip -t argus.zip
          test "$(unzip -p argus.zip manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = 2.0.38
          sha256sum argus.zip > argus.zip.sha256
          rm -f .github/workflows/release-v2.0.38-homekit-cancel.yml .github/workflows/publish-v2038-now.yml .github/workflows/finalize-v2038.yml
          git config user.name Chrisalvir
          git config user.email chrisalvir01@gmail.com
          git add -A
          git commit -m 'Release Argus Home Hub v2.0.38'
          git tag -a v2.0.38 -m 'Argus Home Hub v2.0.38'
          git push origin HEAD:main
          git push origin v2.0.38
          gh release create v2.0.38 argus.zip argus.zip.sha256 --title 'Argus Home Hub v2.0.38' --notes-file docs/RELEASE_NOTES_2.0.38.md
