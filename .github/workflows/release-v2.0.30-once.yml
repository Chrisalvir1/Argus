name: Release v2.0.30 once

on:
  push:
    branches:
      - fix/mobile-background-homekit-polish
    paths:
      - .github/workflows/release-v2.0.30-once.yml

permissions:
  contents: write

jobs:
  release-v2030:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bump sources and write release notes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path('custom_components/argus/manifest.json'),
              Path('custom_components/argus/const.py'),
          ]
          targets += list(Path('custom_components/argus/www').glob('*.js'))
          targets += list(Path('tests').glob('test_*.py'))
          for path in targets:
              text = path.read_text(encoding='utf-8')
              updated = text.replace('2.0.29', '2.0.30')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          section = '''## [2.0.30] - 2026-08-04

          ### Fixed
          - Sensores de instancias activas más compactos y proporcionados en escritorio, móvil y pantalla completa.
          - Persistencia autoritativa de fondos por perfil, incluyendo restauración real del fondo Argus predeterminado.
          - Edición de salidas SOS con eliminación, color y destello suave o rápido.
          - Aplicación fiable de color y destello en SOS y modos, con efecto nativo o respaldo temporizado.
          - El selector de color solo aparece para luces realmente compatibles con `hs`, `xy`, `rgb`, `rgbw` o `rgbww`; luces blancas, `color_temp` y `onoff` conservan únicamente destello.
          - Sensores `unknown` o `unavailable` se identifican como desconectados en lugar de cerrados.

          '''
          marker = 'Todos los cambios relevantes de Argus se documentan aquí. El historial anterior continúa disponible en Git.\n\n'
          if '## [2.0.30]' not in text:
              text = text.replace(marker, marker + section)
              changelog.write_text(text, encoding='utf-8')

          notes = Path('docs/RELEASE_NOTES_2.0.30.md')
          notes.write_text('''# Argus Home Hub v2.0.30

          Esta versión consolida la reparación profunda de fondos, sensores y salidas de alarma.

          ## Correcciones principales
          - Filas de sensores compactas y legibles, con estado de batería y desconexión preservados.
          - Fondos independientes por perfil y retorno confiable al fondo predeterminado de Argus.
          - Acciones SOS editables con color y destello por salida.
          - Color y destello funcionales en los modos de alarma.
          - Detección estricta de capacidades de luz: el color solo se ofrece a dispositivos de color reales.
          - Compatibilidad de destello nativo y respaldo temporizado para dispositivos sin efecto incorporado.

          ## Validación
          - Compilación Python completa.
          - Suite de pruebas de regresión.
          - Validación sintáctica de todos los archivos JavaScript.
          - Validaciones HACS y hassfest del PR aprobadas antes de preparar esta versión.

          > Después de actualizar, reinicia Home Assistant y realiza una recarga completa del navegador sin caché.
          ''', encoding='utf-8')
          PY
      - name: Validate v2.0.30
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/argus
          python -m unittest discover -s tests -v
          for file in custom_components/argus/www/*.js; do node --check "$file"; done
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('custom_components/argus/manifest.json').read_text())['version'] == '2.0.30'
          assert 'VERSION = "2.0.30"' in Path('custom_components/argus/const.py').read_text()
          assert "ARGUS_CARD_VERSION='2.0.30'" in Path('custom_components/argus/www/argus-card.js').read_text()
          PY
      - name: Commit and push v2.0.30
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Chrisalvir'
          git config user.email 'chrisalvir01@gmail.com'
          git add CHANGELOG.md docs/RELEASE_NOTES_2.0.30.md custom_components/argus tests
          git commit -m 'Release v2.0.30 - backgrounds, compact sensors and light capabilities'
          git push origin HEAD:fix/mobile-background-homekit-polish
      - name: Create tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -a v2.0.30 -m 'Argus Home Hub v2.0.30'
          git push origin v2.0.30
          cd custom_components/argus
          zip -r ../../argus.zip . -x '__pycache__/*' '*.pyc'
          cd ../..
          unzip -t argus.zip
          gh release create v2.0.30 argus.zip --title 'Argus Home Hub v2.0.30' --notes-file docs/RELEASE_NOTES_2.0.30.md
      - name: Remove one-time workflow from branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/release-v2.0.30-once.yml
          git commit -m 'chore: remove one-time v2.0.30 release workflow'
          git push origin HEAD:fix/mobile-background-homekit-polish
