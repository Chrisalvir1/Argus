name: Release Argus v2.0.42 stability
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v2042-stability.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Wire stability repair and update version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('custom_components/argus/www/argus-bootstrap.js');s=p.read_text(encoding='utf-8')
          imp="import { applyV2041AuditRepair } from './argus-v2041-audit-repair.js?v=2.0.41';"
          if imp not in s: raise SystemExit('v2041 import missing')
          s=s.replace(imp,imp+"\nimport { applyV2042Stability } from './argus-v2042-stability.js?v=2.0.42';",1)
          app='applyV2041AuditRepair(ArgusPanel);'
          if app not in s: raise SystemExit('v2041 application missing')
          s=s.replace(app,app+'\napplyV2042Stability(ArgusPanel);',1)
          old=".then(({ applyReactDashboardLayout }) => applyReactDashboardLayout(ArgusPanel))"
          if old not in s: raise SystemExit('React adapter marker missing')
          s=s.replace(old,".then(() => console.info('Argus native dashboard persistence active'))",1)
          p.write_text(s,encoding='utf-8')
          targets=[Path('custom_components/argus/manifest.json'),Path('custom_components/argus/const.py'),*Path('custom_components/argus/www').glob('*.js'),*Path('tests').glob('test_*.py')]
          for path in targets:
              text=path.read_text(encoding='utf-8')
              path.write_text(text.replace('2.0.41','2.0.42'),encoding='utf-8')
          PY
          rm -f .github/workflows/release-v2042-stability.yml
      - name: Validate backend and contracts
        run: |
          python -m compileall -q custom_components/argus
          python -m unittest discover -s tests -v
      - name: Validate frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npx tsc --noEmit
          npm test
          npm run build
          if grep -q 'process\.env' custom_components/argus/www/react-dist/argus-dashboard-react.js; then exit 1; fi
          for file in custom_components/argus/www/*.js custom_components/argus/www/react-dist/*.js; do node --check "$file"; done
      - name: Package and publish
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          find custom_components/argus -type d -name __pycache__ -prune -exec rm -rf {} +
          find custom_components/argus -type f -name '*.pyc' -delete
          cd custom_components/argus && zip -qr ../../argus.zip . -x '__pycache__/*' '*/__pycache__/*' '*.pyc' && cd ../..
          unzip -t argus.zip
          test "$(unzip -p argus.zip manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = 2.0.42
          sha256sum argus.zip > argus.zip.sha256
          git config user.name Chrisalvir
          git config user.email chrisalvir01@gmail.com
          git add -A && git commit -m 'Release Argus Home Hub v2.0.42'
          git tag -a v2.0.42 -m 'Argus Home Hub v2.0.42'
          git push origin HEAD:main && git push origin v2.0.42
          gh release create v2.0.42 argus.zip argus.zip.sha256 --title 'Argus Home Hub v2.0.42' --notes-file docs/RELEASE_NOTES_2.0.42.md
