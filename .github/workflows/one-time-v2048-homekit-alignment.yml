name: One-time v2.0.48 HomeKit alignment

on:
  push:
    branches:
      - fix/v2.0.47-stability-root-causes

permissions:
  contents: write

concurrency:
  group: one-time-v2048-homekit-alignment
  cancel-in-progress: false

jobs:
  align-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.0.47-stability-root-causes
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply state-machine and version alignment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "custom_components/argus/alarm_control_panel.py",
              '''        if self._arm_request:
                      attrs["arming_target"] = self._arm_request["target"].value
                      attrs["arming_origin"] = self._arm_request["origin"]
                      attrs["arming_blocking_sensors"] = list(self._arm_request["blocking_sensors"])
                      attrs["arming_waiting_for_sensors"] = bool(self._arm_request["wait_for_sensors"])
          ''',
              '''        if self._arm_request:
                      attrs["arming_target"] = self._arm_request["target"].value
                      attrs["arming_origin"] = self._arm_request["origin"]
                      attrs["arming_blocking_sensors"] = list(self._arm_request["blocking_sensors"])
                      attrs["arming_waiting_for_sensors"] = bool(self._arm_request["wait_for_sensors"])
                      attrs["argus_homekit_transition"] = (
                          self._alarm_state == AlarmControlPanelState.ARMING
                      )
          ''',
          )

          replace_once(
              "custom_components/argus/alarm_control_panel.py",
              '''            # Home Assistant maps generic ARMING to Away in HomeKit. Keep the
                      # alarm target Off while pending and expose progress separately.
                      self._alarm_state = AlarmControlPanelState.DISARMED
          ''',
              '''            # Publish the genuine transition. The Argus HomeKit adapter keeps
                      # the requested Casa/Ausente/Noche target while CurrentState remains
                      # disarmed, which is how Apple Home represents “Armando…”.
                      self._alarm_state = AlarmControlPanelState.ARMING
          ''',
          )

          replace_once(
              "custom_components/argus/safety_runtime.py",
              '''        result = await original_arm(self, target, code, origin=origin)
                  request = getattr(self, "_arm_request", None)
                  if request:
                      # Publish the exact target. HomeKit otherwise maps ARMING to Away
                      # and loses Home/Night. Sensor callbacks are gated below until the
                      # request is genuinely completed.
                      request["published_target_state"] = target.value
                      self._alarm_state = target
                      self.async_write_ha_state()
                      await self._async_mqtt_publish()
                  return result
          ''',
              '''        result = await original_arm(self, target, code, origin=origin)
                  request = getattr(self, "_arm_request", None)
                  if request:
                      request["published_target_state"] = target.value
                      # Never publish ARMED_* before sensors and countdown finish. The
                      # HomeKit adapter reads arming_target and preserves the requested
                      # TargetState while the real entity state remains ARMING.
                      if self._alarm_state != AlarmControlPanelState.ARMING:
                          _LOGGER.error(
                              "Argus arming invariant repaired: expected ARMING, got %s",
                              self._alarm_state,
                          )
                          self._alarm_state = AlarmControlPanelState.ARMING
                          self.async_write_ha_state()
                          await self._async_mqtt_publish()
                  return result
          ''',
          )

          safety_path = Path("custom_components/argus/safety_runtime.py")
          safety = safety_path.read_text(encoding="utf-8")
          safety = safety.replace(
              "During a waiting/countdown request the externally published ARMED_*\n        # state is only a HomeKit target. Never trigger the alarm yet.",
              "During a waiting/countdown request the entity is genuinely ARMING.\n        # Never trigger the alarm until _async_complete_arming commits ARMED_*.",
          )
          safety_path.write_text(safety, encoding="utf-8")

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          historical = {
              "docs/RELEASE_NOTES_2.0.47.md",
              "docs/VERIFICATION_PROTOCOL_2.0.47.md",
          }
          allowed_roots = (
              ".github/",
              "custom_components/",
              "src/",
              "tests/",
          )
          allowed_files = {
              "README.md", "package.json", "package-lock.json",
              "vite.config.ts", "hacs.json",
          }
          for name in tracked:
              if name in historical or name.endswith("one-time-v2048-homekit-alignment.yml"):
                  continue
              if not (name.startswith(allowed_roots) or name in allowed_files):
                  continue
              path = Path(name)
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              text = text.replace(
                  'assertIn("self._alarm_state = target",',
                  'assertIn("self._alarm_state = AlarmControlPanelState.ARMING",',
              )
              text = text.replace(
                  '"self._alarm_state=AlarmControlPanelState.ARMING"',
                  '"self._alarm_state = target"',
              )
              text = text.replace("2.0.47", "2.0.48")
              path.write_text(text, encoding="utf-8")

          alarm = Path("custom_components/argus/alarm_control_panel.py").read_text(encoding="utf-8")
          safety = Path("custom_components/argus/safety_runtime.py").read_text(encoding="utf-8")
          if "self._alarm_state = AlarmControlPanelState.DISARMED" in alarm.split("if arming_delay or", 1)[1].split("await self._async_complete_arming", 1)[0]:
              raise SystemExit("pending arming still publishes DISARMED")
          if "self._alarm_state = target" in safety:
              raise SystemExit("safety runtime still publishes ARMED_* early")
          if 'attrs["argus_homekit_transition"]' not in alarm:
              raise SystemExit("Argus HomeKit marker missing")
          PY

      - name: Verify Python and HomeKit contracts
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/argus tests
          python -m unittest discover -s tests -v

      - name: Verify JavaScript and React build
        run: |
          set -euo pipefail
          for file in custom_components/argus/www/*.js; do node --check "$file"; done
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
          test -s custom_components/argus/www/react-dist/argus-dashboard-react.js
          ! grep -q 'process\.env' custom_components/argus/www/react-dist/argus-dashboard-react.js

      - name: Commit deterministic hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: expose true HomeKit arming transition"
          git push origin HEAD:fix/v2.0.47-stability-root-causes
