name: Finalize Argus 3.7.10

on:
  push:
    branches: [main]
    paths: ['.github/workflows/hold-release-3.7.10.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Publish the validated Argus 3.7.10 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v3.7.10 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release edit v3.7.10 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest --notes-file docs/RELEASE_NOTES_3.7.10.md
          echo 'Argus 3.7.10 published after dependency audit passed.'
