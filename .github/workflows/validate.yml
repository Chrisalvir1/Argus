name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  static-tests:
    name: Static regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q custom_components/argus
      - run: python -m unittest discover -s tests -v
      - name: Validate JavaScript modules
        run: |
          set -euo pipefail
          for file in custom_components/argus/www/*.js; do
            node --check "$file"
          done

  frontend-tests:
    name: React, TypeScript and Vite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Verify committed frontend bundle
        run: git diff --exit-code -- custom_components/argus/www/react-dist/argus-dashboard-react.js

  build-release-artifact:
    name: Build release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          set -euo pipefail
          cd custom_components/argus
          zip -qr "../../argus.zip" . -x '__pycache__/*' '*/__pycache__/*' '*.pyc'
          cd ../..
          test -s argus.zip
          unzip -tq argus.zip
          unzip -l argus.zip | grep -q 'media.py'
          unzip -l argus.zip | grep -q 'www/media-client.js'
          if unzip -l argus.zip | grep -Eq '(__pycache__|\.pyc$)'; then
            echo 'Python cache artifacts found in release archive' >&2
            exit 1
          fi

  validate-hacs:
    name: Validate HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

  validate-hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c
