name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-tests:
    name: Python 3.14 regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify Python runtime
        run: python -c 'import sys; assert (3, 14, 2) <= sys.version_info < (3, 15); print(sys.version)'
      - run: python -m compileall -q custom_components/argus tests
      - run: python -m unittest discover -s tests -v

  javascript-syntax:
    name: JavaScript syntax checks (Node 24 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Node runtime
        run: node -e "if (Number(process.versions.node.split('.')[0]) !== 24) process.exit(1); console.log(process.version)"
      - name: Validate residual JavaScript modules
        run: |
          set -euo pipefail
          for file in custom_components/argus/www/*.js; do node --check "$file"; done

  frontend-tests:
    name: React, TypeScript 7.0.2 and Vite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: test "$(npx tsc --version)" = "Version 7.0.2"
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Verify browser-safe bundle
        run: |
          test -s custom_components/argus/www/react-dist/argus-frontend.js
          ! grep -q 'process\.env' custom_components/argus/www/react-dist/argus-frontend.js

  build-release-artifact:
    name: Build HACS artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          set -euo pipefail
          cd custom_components/argus
          zip -qr "../../argus.zip" . -x '__pycache__/*' '*/__pycache__/*' '*.pyc'
          cd ../..
          test -s argus.zip
          unzip -tq argus.zip
          unzip -l argus.zip | grep -q 'www/react-dist/argus-frontend.js'
          if unzip -l argus.zip | grep -Eq '(__pycache__|\.pyc$)'; then exit 1; fi

  validate-hacs:
    name: Validate HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

  validate-hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c

  dependency-audit:
    name: Weekly dependency audit (informational)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Report high-severity dependency findings
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  version-sync-v2055:
    name: Synchronize verified v2.0.55
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    needs:
      - static-tests
      - javascript-syntax
      - frontend-tests
      - build-release-artifact
      - validate-hacs
      - validate-hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Synchronize version, cleanup and release documentation
        shell: python
        run: |
          from pathlib import Path

          old, new = "2.0.54", "2.0.55"
          paths = [
              "custom_components/argus/const.py",
              "custom_components/argus/manifest.json",
              "custom_components/argus/www/argus-bootstrap.js",
              "src/legacy/argus-card.ts",
              "src/legacy/argus-panel.ts",
              "tests/test_architecture_contract.py",
              "tests/test_security_contract.py",
              "tests/test_v193_sync.py",
              "tests/test_v2050_arming_complete.py",
              "tests/test_v2052_version_contracts.py",
          ]
          for name in paths:
              path = Path(name)
              content = path.read_text(encoding="utf-8")
              if old not in content:
                  raise SystemExit(f"Expected {old} in {name}")
              path.write_text(content.replace(old, new), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          content = changelog.read_text(encoding="utf-8")
          section = """## [2.0.55] - 2026-08-09

          ### Fixed
          - **Armado en espera autoritativo:** al cerrar el último sensor, Argus anuncia el cierre y completa inmediatamente el modo solicitado sin depender de un temporizador obsoleto.
          - **Recuperación de `ARMING`:** el watchdog corrige generaciones desincronizadas y reconstruye solicitudes huérfanas.
          - **TTS por transición:** anuncia sensores cerrados, pendientes y confirmación final antes de armar.
          - **Pruebas ejecutables:** se valida `abierto → cierre parcial → último cierre → armado`.

          """
          marker = "## [2.0.54]"
          if marker not in content:
              raise SystemExit("Missing v2.0.54 changelog marker")
          changelog.write_text(content.replace(marker, section + marker, 1), encoding="utf-8")

          Path("docs/RELEASE_NOTES_2.0.55.md").write_text("""# Argus Home Hub 2.0.55

          ## Reparación definitiva del armado en espera

          - Mantiene `ARMING` mientras existan sensores abiertos.
          - Anuncia por TTS cada sensor cerrado y los que todavía faltan.
          - Al cerrar el último sensor, anuncia la finalización y activa inmediatamente el modo solicitado.
          - El watchdog cubre eventos Aqara/Zigbee retrasados o perdidos.
          - Repara generaciones desincronizadas y solicitudes `ARMING` huérfanas.
          - Serializa reconciliaciones concurrentes para evitar doble TTS o doble armado.
          - Añade pruebas ejecutables de cierre parcial y cierre final.

          La prueba física con Aqara y HomeKit debe realizarse tras instalar v2.0.55 y reiniciar Home Assistant.
          """, encoding="utf-8")

          for temporary in (
              "patch_sensor_state.py",
              "test_errors.txt",
              "test_out.txt",
              ".github/workflows/bump-v2055-once.yml",
          ):
              path = Path(temporary)
              if path.exists():
                  path.unlink()
      - name: Re-run matrix for synchronized sources
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/argus tests
          python -m unittest discover -s tests -v
          npm ci
          test "$(npx tsc --version)" = "Version 7.0.2"
          npx tsc --noEmit
          npm test
          npm run build
          test -s custom_components/argus/www/react-dist/argus-frontend.js
          ! grep -q 'process\.env' custom_components/argus/www/react-dist/argus-frontend.js
      - name: Restore permanent validation workflow and commit
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/validate.yml > .github/workflows/validate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore(release): v2.0.55 arming wait state machine"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
