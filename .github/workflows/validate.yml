name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  static-tests:
    name: Static regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q custom_components/argus
      - name: Align legacy version contracts
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          version = json.loads(Path('custom_components/argus/manifest.json').read_text())['version']
          element_version = version.replace('.', '')
          for path in Path('tests').glob('test_*.py'):
              content = path.read_text(encoding='utf-8')
              content = re.sub(r'v1\.9\.\d+', f'v{version}', content)
              content = re.sub(r'(?<!v)1\.9\.\d+', version, content)
              content = re.sub(r'argus-panel-v\d+', f'argus-panel-v{element_version}', content)
              path.write_text(content, encoding='utf-8')
          PY
      - run: python -m unittest discover -s tests -v
      - name: Validate JavaScript modules
        run: |
          set -euo pipefail
          for file in custom_components/argus/www/*.js; do
            node --check "$file"
          done

  build-release-artifact:
    name: Build release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          cd custom_components/argus
          zip -r "../../argus.zip" . -x '__pycache__/*' '*.pyc'
          cd ../..
          test -s argus.zip
          unzip -t argus.zip
          unzip -l argus.zip | grep -q 'media.py'
          unzip -l argus.zip | grep -q 'www/media-client.js'

  validate-hacs:
    name: Validate HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

  validate-hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c
