name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-tests:
    name: Python ${{ matrix.python }} regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify Python runtime
        run: python -c 'import sys; assert (3, 12, 0) <= sys.version_info < (3, 15, 0); print(sys.version)'
      - run: python -m compileall -q custom_components/argus tests
      - run: python -m unittest discover -s tests -v

  home-assistant-core-compatibility:
    name: Home Assistant Core 2026.10.0 integration API smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: home-assistant/core
          ref: 2026.10.0
          path: home-assistant-core
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.2'
      - name: Install Home Assistant Core 2026.10.0 test dependencies
        run: |
          python -m pip install uv==0.12.19
          cd home-assistant-core
          uv pip install --system -r requirements.txt -r requirements_test.txt
          uv pip install --system -e . --no-deps
      - name: Import Argus against real Core entities and websocket APIs
        run: PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q tests_core
      - name: Run existing Argus regression suite on the exact Core runtime
        run: PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest discover -s tests -v

  javascript-syntax:
    name: JavaScript syntax checks (Node 24 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Node runtime
        run: node -e "if (Number(process.versions.node.split('.')[0]) !== 24) process.exit(1); console.log(process.version)"
      - name: Validate residual JavaScript modules
        run: |
          set -euo pipefail
          for file in custom_components/argus/www/*.js; do node --check "$file"; done

  frontend-tests:
    name: React, TypeScript 7.0.2 and Vite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: test "$(npx tsc --version)" = "Version 7.0.2"
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Verify browser-safe bundle
        run: |
          test -s custom_components/argus/www/react-dist/argus-frontend.js
          ! grep -q 'process\.env' custom_components/argus/www/react-dist/argus-frontend.js

  build-release-artifact:
    name: Build HACS artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          set -euo pipefail
          cd custom_components/argus
          zip -qr "../../argus.zip" . -x '__pycache__/*' '*/__pycache__/*' '*.pyc'
          cd ../..
          test -s argus.zip
          unzip -tq argus.zip
          unzip -l argus.zip | grep -q 'www/react-dist/argus-frontend.js'
          if unzip -l argus.zip | grep -Eq '(__pycache__|\.pyc$)'; then exit 1; fi

  validate-hacs:
    name: Validate HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

  validate-hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Report high-severity dependency findings
        run: npm audit --audit-level=high
