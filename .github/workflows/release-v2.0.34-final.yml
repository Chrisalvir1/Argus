name: Publish Argus v2.0.34 final

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v2.0.34-final.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare v2.0.34 source
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.')
          files = [
              root/'custom_components/argus/manifest.json',
              root/'custom_components/argus/const.py',
              root/'custom_components/argus/www/argus-card.js',
              root/'custom_components/argus/www/argus-bootstrap.js',
              *sorted((root/'tests').glob('test_*.py')),
          ]
          updated = 0
          for path in files:
              text = path.read_text(encoding='utf-8')
              if '2.0.33' in text:
                  path.write_text(text.replace('2.0.33','2.0.34'), encoding='utf-8')
                  updated += 1
          if updated < 8:
              raise SystemExit(f'Expected at least 8 version files, updated {updated}')

          panel = root/'custom_components/argus/www/argus-panel.js'
          text = panel.read_text(encoding='utf-8')
          if 'argus-panel-v2018' not in text:
              raise SystemExit('Missing v2018 panel marker')
          panel.write_text(text.replace('argus-panel-v2018','argus-panel-v2034').replace('v2.0.18','v2.0.34'), encoding='utf-8')

          for path in (root/'custom_components/argus/www/argus-bootstrap.js', root/'custom_components/argus/panel.py'):
              text = path.read_text(encoding='utf-8')
              if 'argus-panel-v2018' not in text:
                  raise SystemExit(f'Missing v2018 marker in {path}')
              path.write_text(text.replace('argus-panel-v2018','argus-panel-v2034'), encoding='utf-8')

          for name in ('test_v193_sync.py','test_v194_panel_flow.py'):
              path = root/'tests'/name
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace('v2.0.18','v2.0.34').replace('argus-panel-v2018','argus-panel-v2034'), encoding='utf-8')
          PY
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -f argus.zip.sha256

      - name: Full regression validation
        run: |
          set -euo pipefail
          test "$(python -c 'import json; print(json.load(open("custom_components/argus/manifest.json"))["version"])')" = "2.0.34"
          grep -q 'webcomponent_name="argus-panel-v2034"' custom_components/argus/panel.py
          grep -q "customElements.get('argus-panel-v2034')" custom_components/argus/www/argus-bootstrap.js
          grep -q "customElements.define('argus-panel-v2034'" custom_components/argus/www/argus-panel.js
          python -m compileall -q custom_components/argus
          python -m unittest discover -s tests -v
          for file in custom_components/argus/www/*.js; do node --check "$file"; done
          npm ci
          npm audit --omit=dev --audit-level=high
          npx tsc --noEmit
          npm test
          npm run build
          git diff --exit-code -- custom_components/argus/www/react-dist/argus-dashboard-react.js

      - name: Validate HACS
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c

      - name: Build verified archive
        run: |
          set -euo pipefail
          find custom_components/argus -type d -name __pycache__ -prune -exec rm -rf {} +
          find custom_components/argus -type f -name '*.pyc' -delete
          cd custom_components/argus
          zip -qr ../../argus.zip . -x '__pycache__/*' '*/__pycache__/*' '*.pyc'
          cd ../..
          unzip -t argus.zip
          test "$(unzip -p argus.zip manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "2.0.34"
          if unzip -l argus.zip | grep -Eq '(__pycache__|\.pyc$)'; then exit 1; fi
          sha256sum argus.zip > argus.zip.sha256

      - name: Commit tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify refs/tags/v2.0.34 >/dev/null; then exit 1; fi
          rm -f .github/workflows/release-v2.0.34-once.yml
          rm -f .github/workflows/release-v2.0.34-final.yml
          git config user.name 'Chrisalvir'
          git config user.email 'chrisalvir01@gmail.com'
          git add -A
          git commit -m 'Release Argus Home Hub v2.0.34'
          git tag -a v2.0.34 -m 'Argus Home Hub v2.0.34'
          git push origin HEAD:main
          git push origin v2.0.34
          gh release create v2.0.34 argus.zip argus.zip.sha256 --title 'Argus Home Hub v2.0.34' --notes-file docs/RELEASE_NOTES_2.0.34.md
