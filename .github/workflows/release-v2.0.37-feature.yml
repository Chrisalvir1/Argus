name: Release Argus v2.0.37 feature
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v2.0.37-feature.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Apply v2.0.37 backend and HomeKit state fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('custom_components/argus/alarm_control_panel.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('from .security import PinAttemptLimiter, verify_pin', 'from .security import PinAttemptLimiter, verify_pin\nfrom .arming_voice import async_announce_arming_wait_update')
          old='''        if arming_delay or (open_sensors and policy == "pending"):\n            self._arming_target = target\n            self._arm_request = {"generation": self._arm_generation, "target": target, "origin": origin, "blocking_sensors": open_sensors, "wait_for_sensors": policy == "pending", "delay_elapsed": not bool(arming_delay)}\n            self._alarm_state = AlarmControlPanelState.ARMING\n            self.async_write_ha_state()\n            await self._async_mqtt_publish()\n            if arming_delay:\n                self._arming_listener = async_call_later(self.hass, arming_delay, lambda now, generation=self._arm_generation: self._async_finish_arming(now, generation))\n            _LOGGER.info("Argus: arming %s in %s seconds", target, arming_delay)\n            return'''
          new='''        if arming_delay or (open_sensors and policy == "pending"):\n            self._arming_target = target\n            self._arm_request = {"generation": self._arm_generation, "target": target, "origin": origin, "blocking_sensors": open_sensors, "wait_for_sensors": policy == "pending", "delay_elapsed": not bool(arming_delay)}\n            # Home Assistant maps generic ARMING to Away in HomeKit. Keep the\n            # alarm target Off while pending and expose progress separately.\n            self._alarm_state = AlarmControlPanelState.DISARMED\n            self.async_write_ha_state()\n            await self._async_mqtt_publish()\n            if open_sensors and policy == "pending":\n                await async_announce_arming_wait_update(\n                    self.hass, self._config_entry, alarm_entity_id=self.entity_id,\n                    target=target.value, previous_open=[], current_open=open_sensors,\n                )\n            if arming_delay:\n                self._arming_listener = async_call_later(self.hass, arming_delay, lambda now, generation=self._arm_generation: self._async_finish_arming(now, generation))\n            _LOGGER.info("Argus: HomeKit-safe arming request %s in %s seconds", target, arming_delay)\n            return'''
          if old not in s: raise SystemExit('arming block not found')
          s=s.replace(old,new)
          old2='''        request = self._arm_request\n        if not request or self._alarm_state != AlarmControlPanelState.ARMING:\n            return\n        open_sensors = self._open_blocking_sensors(request["target"]) if request["wait_for_sensors"] else []\n        request["blocking_sensors"] = open_sensors\n        self.async_write_ha_state()'''
          new2='''        request = self._arm_request\n        if not request:\n            return\n        previous_open = list(request.get("blocking_sensors") or [])\n        open_sensors = self._open_blocking_sensors(request["target"]) if request["wait_for_sensors"] else []\n        request["blocking_sensors"] = open_sensors\n        self.async_write_ha_state()\n        if request["wait_for_sensors"] and previous_open != open_sensors:\n            await async_announce_arming_wait_update(\n                self.hass, self._config_entry, alarm_entity_id=self.entity_id,\n                target=request["target"].value, previous_open=previous_open, current_open=open_sensors,\n            )'''
          if old2 not in s: raise SystemExit('recheck block not found')
          s=s.replace(old2,new2)
          s=s.replace('''        if self._alarm_state == AlarmControlPanelState.ARMING and self._arming_target:\n            self._alarm_state = self._arming_target''','''        if self._arm_request and self._arming_target:\n            self._alarm_state = self._arming_target''',1)
          p.write_text(s,encoding='utf-8')

          c=Path('custom_components/argus/const.py')
          t=c.read_text(encoding='utf-8').replace('VERSION = "2.0.36"','VERSION = "2.0.37"')
          t += '''\nCONF_ARMING_VOICE_ENABLED = "arming_voice_enabled"\nCONF_ARMING_VOICE_TTS = "arming_voice_tts"\nCONF_ARMING_VOICE_PLAYERS = "arming_voice_players"\nCONF_ARMING_VOICE_MESSAGE_START = "arming_voice_message_start"\nCONF_ARMING_VOICE_MESSAGE_REMAINING = "arming_voice_message_remaining"\nCONF_ARMING_VOICE_MESSAGE_LAST = "arming_voice_message_last"\nCONF_ARMING_VOICE_MESSAGE_COMPLETE = "arming_voice_message_complete"\nDEFAULT_ARMING_VOICE_MESSAGE_START = "No puedo completar el armado. Hay {count} sensores abiertos: {sensors}."\nDEFAULT_ARMING_VOICE_MESSAGE_REMAINING = "{closed} se ha cerrado. Faltan {count} sensores por cerrar: {sensors}."\nDEFAULT_ARMING_VOICE_MESSAGE_LAST = "Falta un sensor por cerrar: {sensors}."\nDEFAULT_ARMING_VOICE_MESSAGE_COMPLETE = "Todos los sensores están cerrados. Argus continuará el armado en modo {mode}."\n'''
          c.write_text(t,encoding='utf-8')

          for path in [Path('custom_components/argus/manifest.json'),Path('custom_components/argus/www/argus-card.js'),Path('custom_components/argus/www/argus-bootstrap.js'),Path('custom_components/argus/www/argus-panel.js'),*Path('tests').glob('test_*.py')]:
              path.write_text(path.read_text(encoding='utf-8').replace('2.0.36','2.0.37'),encoding='utf-8')
          PY
      - name: Extend options flow and translations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('custom_components/argus/config_flow.py'); s=p.read_text(encoding='utf-8')
          s=s.replace('    DOMAIN,\n)', '''    DOMAIN,\n    CONF_ARMING_VOICE_ENABLED, CONF_ARMING_VOICE_TTS, CONF_ARMING_VOICE_PLAYERS,\n    CONF_ARMING_VOICE_MESSAGE_START, CONF_ARMING_VOICE_MESSAGE_REMAINING,\n    CONF_ARMING_VOICE_MESSAGE_LAST, CONF_ARMING_VOICE_MESSAGE_COMPLETE,\n    DEFAULT_ARMING_VOICE_MESSAGE_START, DEFAULT_ARMING_VOICE_MESSAGE_REMAINING,\n    DEFAULT_ARMING_VOICE_MESSAGE_LAST, DEFAULT_ARMING_VOICE_MESSAGE_COMPLETE,\n)''')
          marker='''            vol.Optional(\n                CONF_LINKED_ALARM_PANELS,\n                default=values.get(CONF_LINKED_ALARM_PANELS, []),\n            ): selector.EntitySelector(\n                selector.EntitySelectorConfig(multiple=True, domain="alarm_control_panel")\n            ),'''
          addition=marker+'''\n            vol.Optional(CONF_ARMING_VOICE_ENABLED, default=bool(values.get(CONF_ARMING_VOICE_ENABLED, False))): selector.BooleanSelector(),\n            vol.Optional(CONF_ARMING_VOICE_TTS, default=values.get(CONF_ARMING_VOICE_TTS, "")): selector.EntitySelector(selector.EntitySelectorConfig(domain="tts")),\n            vol.Optional(CONF_ARMING_VOICE_PLAYERS, default=values.get(CONF_ARMING_VOICE_PLAYERS, [])): selector.EntitySelector(selector.EntitySelectorConfig(multiple=True, domain="media_player")),\n            vol.Optional(CONF_ARMING_VOICE_MESSAGE_START, default=values.get(CONF_ARMING_VOICE_MESSAGE_START, DEFAULT_ARMING_VOICE_MESSAGE_START)): selector.TextSelector(selector.TextSelectorConfig(multiline=True)),\n            vol.Optional(CONF_ARMING_VOICE_MESSAGE_REMAINING, default=values.get(CONF_ARMING_VOICE_MESSAGE_REMAINING, DEFAULT_ARMING_VOICE_MESSAGE_REMAINING)): selector.TextSelector(selector.TextSelectorConfig(multiline=True)),\n            vol.Optional(CONF_ARMING_VOICE_MESSAGE_LAST, default=values.get(CONF_ARMING_VOICE_MESSAGE_LAST, DEFAULT_ARMING_VOICE_MESSAGE_LAST)): selector.TextSelector(selector.TextSelectorConfig(multiline=True)),\n            vol.Optional(CONF_ARMING_VOICE_MESSAGE_COMPLETE, default=values.get(CONF_ARMING_VOICE_MESSAGE_COMPLETE, DEFAULT_ARMING_VOICE_MESSAGE_COMPLETE)): selector.TextSelector(selector.TextSelectorConfig(multiline=True)),'''
          if marker not in s: raise SystemExit('options marker not found')
          p.write_text(s.replace(marker,addition),encoding='utf-8')

          import json
          for name, labels in {
            'strings.json': {'arming_voice_enabled':'Enable intelligent arming voice','arming_voice_tts':'TTS engine','arming_voice_players':'Media players','arming_voice_message_start':'Initial wait message','arming_voice_message_remaining':'Remaining sensors message','arming_voice_message_last':'Last sensor message','arming_voice_message_complete':'All sensors closed message'},
            'translations/es.json': {'arming_voice_enabled':'Activar avisos inteligentes de armado','arming_voice_tts':'Motor TTS','arming_voice_players':'Reproductores multimedia','arming_voice_message_start':'Mensaje inicial de espera','arming_voice_message_remaining':'Mensaje de sensores restantes','arming_voice_message_last':'Mensaje del último sensor','arming_voice_message_complete':'Mensaje de todos cerrados'},
          }.items():
              path=Path('custom_components/argus')/name
              data=json.loads(path.read_text(encoding='utf-8'))
              data['options']['step']['init']['data'].update(labels)
              data.setdefault('entity',{}).setdefault('binary_sensor',{})['arming_in_progress']={'name':'Armado en progreso' if name.startswith('translations') else 'Arming in progress'}
              path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Add regression tests and validate
        run: |
          cat > tests/test_arming_voice_homekit_contract.py <<'PY'
          from pathlib import Path
          import unittest
          ROOT=Path(__file__).resolve().parents[1]
          COMPONENT=ROOT/'custom_components'/'argus'
          class TestArmingVoiceHomeKitContract(unittest.TestCase):
              def test_homekit_wait_is_disarmed_and_progress_is_external(self):
                  panel=(COMPONENT/'alarm_control_panel.py').read_text(encoding='utf-8')
                  binary=(COMPONENT/'binary_sensor.py').read_text(encoding='utf-8')
                  self.assertIn('Home Assistant maps generic ARMING to Away in HomeKit', panel)
                  self.assertIn('self._alarm_state = AlarmControlPanelState.DISARMED', panel)
                  self.assertIn('ArgusArmingInProgressBinarySensor', binary)
              def test_voice_uses_dynamic_registry_names_and_event(self):
                  voice=(COMPONENT/'arming_voice.py').read_text(encoding='utf-8')
                  self.assertIn('friendly_name', voice)
                  self.assertIn('entry.unique_id', voice)
                  self.assertIn('device.identifiers', voice)
                  self.assertIn('argus_arming_wait_update', voice)
                  self.assertIn('media_player_entity_id', voice)
          if __name__=='__main__': unittest.main()
          PY
          npm ci
          npm audit --omit=dev --audit-level=high
          npx tsc --noEmit
          npm test
          npm run build
          if grep -q 'process\.env' custom_components/argus/www/react-dist/argus-dashboard-react.js; then exit 1; fi
          python -m compileall -q custom_components/argus
          python -m unittest discover -s tests -v
          for file in custom_components/argus/www/*.js custom_components/argus/www/react-dist/*.js; do node --check "$file"; done
      - name: Build verify and publish
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          find custom_components/argus -type d -name __pycache__ -prune -exec rm -rf {} +
          find custom_components/argus -type f -name '*.pyc' -delete
          cd custom_components/argus && zip -qr ../../argus.zip . -x '__pycache__/*' '*/__pycache__/*' '*.pyc' && cd ../..
          unzip -t argus.zip
          test "$(unzip -p argus.zip manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = '2.0.37'
          sha256sum argus.zip > argus.zip.sha256
          rm -f .github/workflows/release-v2.0.37-feature.yml
          git config user.name 'Chrisalvir'; git config user.email 'chrisalvir01@gmail.com'
          git add -A && git commit -m 'Release Argus Home Hub v2.0.37'
          git tag -a v2.0.37 -m 'Argus Home Hub v2.0.37'
          git push origin HEAD:main && git push origin v2.0.37
          gh release create v2.0.37 argus.zip argus.zip.sha256 --title 'Argus Home Hub v2.0.37' --notes-file docs/RELEASE_NOTES_2.0.37.md
