name: Diagnose corrected v2.0.33 release once

on:
  push:
    branches:
      - fix/mobile-background-homekit-polish
    paths:
      - .github/workflows/release-v2.0.33-once.yml

permissions:
  contents: write

jobs:
  diagnose-corrected-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-background-homekit-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - id: sync
        name: Synchronize release markers
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'custom_components/argus/const.py': [('VERSION = "2.0.32"', 'VERSION = "2.0.33"')],
              'custom_components/argus/www/argus-card.js': [("ARGUS_CARD_VERSION='2.0.32'", "ARGUS_CARD_VERSION='2.0.33'")],
              'custom_components/argus/www/argus-bootstrap.js': [('2.0.32', '2.0.33')],
              'tests/test_architecture_contract.py': [('2.0.32', '2.0.33')],
              'tests/test_security_contract.py': [('2.0.32', '2.0.33')],
              'tests/test_v193_sync.py': [
                  ('2.0.32', '2.0.33'),
                  ('manifest.json version must be 2.0.18', 'manifest.json version must be 2.0.33'),
                  ('argus-bootstrap.js must reference version 2.0.18 for cache-busting', 'argus-bootstrap.js must reference version 2.0.33 for cache-busting'),
              ],
          }
          for file_name, changes in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f'Missing marker in {file_name}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - id: npmci
        continue-on-error: true
        run: npm ci
      - id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - id: tsc
        continue-on-error: true
        run: npx tsc --noEmit
      - id: vitest
        continue-on-error: true
        run: npm test
      - id: build
        continue-on-error: true
        run: npm run build
      - id: bundlediff
        continue-on-error: true
        run: git diff --exit-code -- custom_components/argus/www/react-dist/argus-dashboard-react.js
      - id: python
        continue-on-error: true
        run: |
          python -m compileall -q custom_components/argus
          python -m unittest discover -s tests -v
      - id: javascript
        continue-on-error: true
        run: |
          for file in custom_components/argus/www/*.js; do node --check "$file"; done
      - id: archive
        continue-on-error: true
        run: |
          cd custom_components/argus
          zip -qr ../../argus.zip . -x '__pycache__/*' '*.pyc'
          cd ../..
          test -s argus.zip
          unzip -tq argus.zip

      - name: Write outcomes
        run: |
          cat > docs/RELEASE_2.0.33_DIAGNOSTICS.txt <<'EOF'
          version_sync=${{ steps.sync.outcome }}
          npm_ci=${{ steps.npmci.outcome }}
          production_audit=${{ steps.audit.outcome }}
          typescript=${{ steps.tsc.outcome }}
          vitest=${{ steps.vitest.outcome }}
          vite_build=${{ steps.build.outcome }}
          bundle_reproducibility=${{ steps.bundlediff.outcome }}
          python_tests=${{ steps.python.outcome }}
          javascript_syntax=${{ steps.javascript.outcome }}
          archive=${{ steps.archive.outcome }}
          EOF
          cat docs/RELEASE_2.0.33_DIAGNOSTICS.txt

      - name: Commit corrected-release diagnostics
        run: |
          git config user.name 'Chrisalvir'
          git config user.email 'chrisalvir01@gmail.com'
          git add docs/RELEASE_2.0.33_DIAGNOSTICS.txt
          git commit -m 'chore: capture corrected v2.0.33 release diagnostics'
          git push origin HEAD:fix/mobile-background-homekit-polish
