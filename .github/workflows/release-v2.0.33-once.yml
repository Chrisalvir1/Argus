name: Capture post-sync v2.0.33 failure once

on:
  push:
    branches:
      - fix/mobile-background-homekit-polish
    paths:
      - .github/workflows/release-v2.0.33-once.yml

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-background-homekit-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply intended v2.0.33 synchronization
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'custom_components/argus/const.py': [('VERSION = "2.0.32"', 'VERSION = "2.0.33"')],
              'custom_components/argus/www/argus-card.js': [("ARGUS_CARD_VERSION='2.0.32'", "ARGUS_CARD_VERSION='2.0.33'")],
              'custom_components/argus/www/argus-bootstrap.js': [('2.0.32', '2.0.33')],
              'tests/test_architecture_contract.py': [('2.0.32', '2.0.33')],
              'tests/test_security_contract.py': [('2.0.32', '2.0.33')],
              'tests/test_v193_sync.py': [
                  ('2.0.32', '2.0.33'),
                  ('manifest.json version must be 2.0.18', 'manifest.json version must be 2.0.33'),
                  ('argus-bootstrap.js must reference version 2.0.18 for cache-busting', 'argus-bootstrap.js must reference version 2.0.33 for cache-busting'),
              ],
          }
          for file_name, changes in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f'Missing marker in {file_name}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Capture complete post-sync test output
        run: |
          set +e
          python -m unittest discover -s tests -v > docs/RELEASE_2.0.33_DIAGNOSTICS.txt 2>&1
          CODE=$?
          echo >> docs/RELEASE_2.0.33_DIAGNOSTICS.txt
          echo "UNITTEST_EXIT_CODE=$CODE" >> docs/RELEASE_2.0.33_DIAGNOSTICS.txt
          cat docs/RELEASE_2.0.33_DIAGNOSTICS.txt
          exit 0

      - name: Commit post-sync diagnostics
        run: |
          git config user.name 'Chrisalvir'
          git config user.email 'chrisalvir01@gmail.com'
          git add docs/RELEASE_2.0.33_DIAGNOSTICS.txt
          git commit -m 'chore: capture post-sync v2.0.33 failure'
          git push origin HEAD:fix/mobile-background-homekit-polish
