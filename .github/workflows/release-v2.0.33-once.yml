name: Diagnose v2.0.33 release once

on:
  push:
    branches:
      - fix/mobile-background-homekit-polish
    paths:
      - .github/workflows/release-v2.0.33-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-background-homekit-polish
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Capture every release check
        shell: bash
        run: |
          set -u
          LOG='docs/RELEASE_2.0.33_DIAGNOSTICS.txt'
          : > "$LOG"
          run_check() {
            local label="$1"
            shift
            {
              echo
              echo "===== $label ====="
              "$@"
              local code=$?
              echo "EXIT_CODE=$code"
              return 0
            } >> "$LOG" 2>&1
          }
          run_check 'manifest version' python -c 'import json; print(json.load(open("custom_components/argus/manifest.json"))["version"])'
          run_check 'npm ci' npm ci
          run_check 'TypeScript package' node -p "require('./node_modules/typescript/package.json').version"
          run_check 'npm production audit' npm audit --omit=dev --audit-level=high
          run_check 'TypeScript strict check' npx tsc --noEmit
          run_check 'Vitest' npm test
          run_check 'Vite build' npm run build
          run_check 'compiled bundle diff' git diff --exit-code -- custom_components/argus/www/react-dist/argus-dashboard-react.js
          run_check 'Python compileall' python -m compileall -q custom_components/argus
          run_check 'Python unittest discovery' python -m unittest discover -s tests -v
          run_check 'JavaScript syntax' bash -lc 'for file in custom_components/argus/www/*.js; do node --check "$file" || exit 1; done'
          run_check 'archive build' bash -lc 'cd custom_components/argus && zip -qr ../../argus.zip . -x "__pycache__/*" "*.pyc" && cd ../.. && test -s argus.zip && unzip -tq argus.zip'
          run_check 'archive manifest' bash -lc 'unzip -p argus.zip manifest.json | python -c '"'"'import json,sys; print(json.load(sys.stdin)["version"])'"'"''
          cat "$LOG"

      - name: Commit diagnostics
        run: |
          set -euo pipefail
          git config user.name 'Chrisalvir'
          git config user.email 'chrisalvir01@gmail.com'
          git add docs/RELEASE_2.0.33_DIAGNOSTICS.txt
          git commit -m 'chore: capture v2.0.33 release diagnostics'
          git push origin HEAD:fix/mobile-background-homekit-polish
