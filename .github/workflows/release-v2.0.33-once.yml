name: Capture v2.0.33 Python failure once

on:
  push:
    branches:
      - fix/mobile-background-homekit-polish
    paths:
      - .github/workflows/release-v2.0.33-once.yml

permissions:
  contents: write

jobs:
  diagnose-python:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-background-homekit-polish
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Capture Python unittest output
        shell: bash
        run: |
          set +e
          python -m compileall -q custom_components/argus > docs/RELEASE_2.0.33_DIAGNOSTICS.txt 2>&1
          COMPILE_CODE=$?
          python -m unittest discover -s tests -v >> docs/RELEASE_2.0.33_DIAGNOSTICS.txt 2>&1
          TEST_CODE=$?
          {
            echo
            echo "COMPILE_EXIT_CODE=$COMPILE_CODE"
            echo "UNITTEST_EXIT_CODE=$TEST_CODE"
          } >> docs/RELEASE_2.0.33_DIAGNOSTICS.txt
          cat docs/RELEASE_2.0.33_DIAGNOSTICS.txt
          exit 0

      - name: Commit Python diagnostics
        run: |
          git config user.name 'Chrisalvir'
          git config user.email 'chrisalvir01@gmail.com'
          git add docs/RELEASE_2.0.33_DIAGNOSTICS.txt
          git commit -m 'chore: capture failing v2.0.33 Python test'
          git push origin HEAD:fix/mobile-background-homekit-polish
