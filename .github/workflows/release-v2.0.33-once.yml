name: Finalize v2.0.33 release once

on:
  push:
    branches:
      - fix/mobile-background-homekit-polish
    paths:
      - .github/workflows/release-v2.0.33-once.yml

permissions:
  contents: write

jobs:
  finalize-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-background-homekit-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Synchronize all v2.0.33 runtime and test contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_files = [
              Path('custom_components/argus/const.py'),
              Path('custom_components/argus/www/argus-card.js'),
              Path('custom_components/argus/www/argus-bootstrap.js'),
          ]
          for path in runtime_files:
              text = path.read_text(encoding='utf-8')
              if '2.0.32' not in text:
                  raise SystemExit(f'Missing expected 2.0.32 runtime marker in {path}')
              path.write_text(text.replace('2.0.32', '2.0.33'), encoding='utf-8')

          updated_tests = 0
          for path in Path('tests').glob('test_*.py'):
              text = path.read_text(encoding='utf-8')
              if '2.0.32' in text:
                  text = text.replace('2.0.32', '2.0.33')
                  text = text.replace(
                      'manifest.json version must be 2.0.18',
                      'manifest.json version must be 2.0.33',
                  )
                  text = text.replace(
                      'argus-bootstrap.js must reference version 2.0.18 for cache-busting',
                      'argus-bootstrap.js must reference version 2.0.33 for cache-busting',
                  )
                  path.write_text(text, encoding='utf-8')
                  updated_tests += 1
          if updated_tests < 3:
              raise SystemExit(f'Expected multiple release contracts; updated {updated_tests}')
          PY

      - name: Validate React dashboard and TypeScript 7
        run: |
          set -euo pipefail
          npm ci
          test "$(node -p "require('./node_modules/typescript/package.json').version")" = "7.0.2"
          npm audit --omit=dev --audit-level=high
          npx tsc --noEmit
          npm test
          npm run build
          git diff --exit-code -- custom_components/argus/www/react-dist/argus-dashboard-react.js

      - name: Validate all Argus regression contracts
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/argus
          python -m unittest discover -s tests -v
          for file in custom_components/argus/www/*.js; do
            node --check "$file"
          done

      - name: Build and verify release archive
        run: |
          set -euo pipefail
          test "$(python -c 'import json; print(json.load(open("custom_components/argus/manifest.json"))["version"])')" = "2.0.33"
          cd custom_components/argus
          zip -qr ../../argus.zip . -x '__pycache__/*' '*.pyc'
          cd ../..
          test -s argus.zip
          unzip -tq argus.zip
          test "$(unzip -p argus.zip manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "2.0.33"
          sha256sum argus.zip | tee argus.zip.sha256

      - name: Commit, tag and publish v2.0.33
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify refs/tags/v2.0.33 >/dev/null; then
            echo 'Tag v2.0.33 already exists' >&2
            exit 1
          fi
          rm .github/workflows/release-v2.0.33-once.yml
          rm -f docs/RELEASE_2.0.33_DIAGNOSTICS.txt
          git config user.name 'Chrisalvir'
          git config user.email 'chrisalvir01@gmail.com'
          git add -A
          git commit -m 'Release Argus Home Hub v2.0.33'
          git tag -a v2.0.33 -m 'Argus Home Hub v2.0.33'
          git push origin HEAD:fix/mobile-background-homekit-polish
          git push origin v2.0.33
          gh release create v2.0.33 argus.zip argus.zip.sha256 --title 'Argus Home Hub v2.0.33' --notes-file docs/RELEASE_NOTES_2.0.33.md
          gh release view v2.0.33
