name: Diagnose v2.0.33 release once

on:
  push:
    branches:
      - fix/mobile-background-homekit-polish
    paths:
      - .github/workflows/release-v2.0.33-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-background-homekit-polish
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - id: npmci
        name: npm ci
        continue-on-error: true
        run: npm ci

      - id: audit
        name: Production audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - id: tsc
        name: TypeScript check
        continue-on-error: true
        run: npx tsc --noEmit

      - id: vitest
        name: Vitest
        continue-on-error: true
        run: npm test

      - id: build
        name: Vite build
        continue-on-error: true
        run: npm run build

      - id: bundlediff
        name: Bundle reproducibility
        continue-on-error: true
        run: git diff --exit-code -- custom_components/argus/www/react-dist/argus-dashboard-react.js

      - id: python
        name: Python tests
        continue-on-error: true
        run: |
          python -m compileall -q custom_components/argus
          python -m unittest discover -s tests -v

      - id: javascript
        name: JavaScript syntax
        continue-on-error: true
        run: |
          for file in custom_components/argus/www/*.js; do
            node --check "$file"
          done

      - id: archive
        name: Archive validation
        continue-on-error: true
        run: |
          cd custom_components/argus
          zip -qr ../../argus.zip . -x '__pycache__/*' '*.pyc'
          cd ../..
          test -s argus.zip
          unzip -tq argus.zip

      - name: Write diagnostic outcomes
        run: |
          cat > docs/RELEASE_2.0.33_DIAGNOSTICS.txt <<'EOF'
          npm_ci=${{ steps.npmci.outcome }}
          production_audit=${{ steps.audit.outcome }}
          typescript=${{ steps.tsc.outcome }}
          vitest=${{ steps.vitest.outcome }}
          vite_build=${{ steps.build.outcome }}
          bundle_reproducibility=${{ steps.bundlediff.outcome }}
          python_tests=${{ steps.python.outcome }}
          javascript_syntax=${{ steps.javascript.outcome }}
          archive=${{ steps.archive.outcome }}
          EOF
          cat docs/RELEASE_2.0.33_DIAGNOSTICS.txt

      - name: Commit diagnostics
        run: |
          git config user.name 'Chrisalvir'
          git config user.email 'chrisalvir01@gmail.com'
          git add docs/RELEASE_2.0.33_DIAGNOSTICS.txt
          git commit -m 'chore: capture v2.0.33 release diagnostics'
          git push origin HEAD:fix/mobile-background-homekit-polish
