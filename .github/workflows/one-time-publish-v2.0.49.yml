name: One-time publish v2.0.49

on:
  push:
    paths:
      - '.github/workflows/one-time-publish-v2.0.49.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: d0639ae8743e12f00dd4d6994facb31e2330cdd8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: d0639ae8743e12f00dd4d6994facb31e2330cdd8
      - name: Validate release version
        run: |
          set -euo pipefail
          grep -q '"version": "2.0.49"' custom_components/argus/manifest.json
          test -f docs/RELEASE_NOTES_2.0.49.md
      - name: Build HACS release archive
        run: |
          set -euo pipefail
          cd custom_components/argus
          zip -qr ../../argus.zip . -x '__pycache__/*' '*/__pycache__/*' '*.pyc'
          cd ../..
          test -s argus.zip
          unzip -tq argus.zip
          sha256sum argus.zip > argus.zip.sha256
      - name: Retarget release tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -d v2.0.49 || true
          git tag -fa v2.0.49 "$RELEASE_SHA" -m 'Argus Home Hub v2.0.49'
          git push --force origin refs/tags/v2.0.49
      - name: Publish GitHub release
        run: |
          set -euo pipefail
          if gh release view v2.0.49 >/dev/null 2>&1; then
            gh release delete v2.0.49 --yes
          fi
          gh release create v2.0.49 argus.zip argus.zip.sha256 \
            --title 'Argus Home Hub v2.0.49' \
            --notes-file docs/RELEASE_NOTES_2.0.49.md \
            --target "$RELEASE_SHA" \
            --latest
