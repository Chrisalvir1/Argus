name: One-time repair v2.0.49 version contracts

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-v2049-version-contract.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize and commit release contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('custom_components/argus/const.py'): [('VERSION = "2.0.48"', 'VERSION = "2.0.49"')],
              Path('custom_components/argus/www/argus-card.js'): [("ARGUS_CARD_VERSION='2.0.48'", "ARGUS_CARD_VERSION='2.0.49'")],
              Path('custom_components/argus/www/argus-panel.js'): [('v2.0.48', 'v2.0.49')],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing token in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          for path in Path('tests').glob('*.py'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('2.0.48', '2.0.49')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/argus/const.py custom_components/argus/www/argus-card.js custom_components/argus/www/argus-panel.js tests
          git commit -m 'release: synchronize v2.0.49 version contracts'
          git push origin HEAD:main
