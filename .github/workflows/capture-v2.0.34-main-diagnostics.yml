name: Capture main v2.0.34 diagnostics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/capture-v2.0.34-main-diagnostics.yml

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply release transformation
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.')
          files = [root/'custom_components/argus/manifest.json', root/'custom_components/argus/const.py', root/'custom_components/argus/www/argus-card.js', root/'custom_components/argus/www/argus-bootstrap.js', *sorted((root/'tests').glob('test_*.py'))]
          for path in files:
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace('2.0.33','2.0.34'), encoding='utf-8')
          panel = root/'custom_components/argus/www/argus-panel.js'
          text = panel.read_text(encoding='utf-8').replace('argus-panel-v2018','argus-panel-v2034').replace('v2.0.18','v2.0.34')
          panel.write_text(text,encoding='utf-8')
          bootstrap=root/'custom_components/argus/www/argus-bootstrap.js'
          bootstrap.write_text(bootstrap.read_text(encoding='utf-8').replace('argus-panel-v2018','argus-panel-v2034'),encoding='utf-8')
          panel_py=root/'custom_components/argus/panel.py'
          panel_py.write_text(panel_py.read_text(encoding='utf-8').replace('argus-panel-v2018','argus-panel-v2034'),encoding='utf-8')
          for name in ('test_v193_sync.py','test_v194_panel_flow.py'):
              path=root/'tests'/name
              path.write_text(path.read_text(encoding='utf-8').replace('v2.0.18','v2.0.34').replace('argus-panel-v2018','argus-panel-v2034'),encoding='utf-8')
          PY
      - name: Capture diagnostics
        run: |
          set +e
          {
            echo '=== VERSION MARKERS ==='
            grep -n 'version' custom_components/argus/manifest.json
            grep -n 'VERSION =' custom_components/argus/const.py
            grep -n 'argus-panel-v2034' custom_components/argus/panel.py custom_components/argus/www/argus-bootstrap.js custom_components/argus/www/argus-panel.js | tail -20
            echo '=== PYTHON ==='
            python -m compileall -q custom_components/argus
            python -m unittest discover -s tests -v
            echo "PYTHON_EXIT=$?"
            echo '=== NPM ==='
            npm ci
            npm audit --omit=dev --audit-level=high
            echo "AUDIT_EXIT=$?"
            npx tsc --noEmit
            echo "TSC_EXIT=$?"
            npm test
            echo "VITEST_EXIT=$?"
            npm run build
            echo "BUILD_EXIT=$?"
            git diff --exit-code -- custom_components/argus/www/react-dist/argus-dashboard-react.js
            echo "BUNDLE_EXIT=$?"
          } > docs/MAIN_RELEASE_2.0.34_DIAGNOSTICS.txt 2>&1
          cat docs/MAIN_RELEASE_2.0.34_DIAGNOSTICS.txt
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/MAIN_RELEASE_2.0.34_DIAGNOSTICS.txt
          git commit -m 'chore: capture main v2.0.34 diagnostics'
          git push origin HEAD:main
