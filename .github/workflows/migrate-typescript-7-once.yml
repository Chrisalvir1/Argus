name: Migrate dashboard to TypeScript 7 once

on:
  push:
    branches:
      - feature/react-dashboard-layout
    paths:
      - .github/workflows/migrate-typescript-7-once.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/react-dashboard-layout

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install current dependencies
        run: npm ci

      - name: Measure TypeScript 5.9.2 baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          OLD_VERSION="$(npx tsc --version)"
          START_NS="$(date +%s%N)"
          npx tsc --noEmit
          END_NS="$(date +%s%N)"
          OLD_MS="$(( (END_NS - START_NS) / 1000000 ))"
          echo "version=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "milliseconds=$OLD_MS" >> "$GITHUB_OUTPUT"

      - name: Install stable TypeScript 7.0.2
        run: npm install --save-dev --save-exact typescript@7.0.2

      - name: Validate TypeScript 7 compatibility
        id: typescript7
        shell: bash
        run: |
          set -euo pipefail
          INSTALLED_VERSION="$(node -p "require('./node_modules/typescript/package.json').version")"
          test "$INSTALLED_VERSION" = "7.0.2"
          NEW_VERSION="$(npx tsc --version)"
          START_NS="$(date +%s%N)"
          npx tsc --noEmit
          END_NS="$(date +%s%N)"
          NEW_MS="$(( (END_NS - START_NS) / 1000000 ))"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "milliseconds=$NEW_MS" >> "$GITHUB_OUTPUT"

      - name: Run dashboard verification
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high
          npm test
          npm run build
          python -m unittest tests.test_react_dashboard_layout_contract -v

      - name: Record migration metrics
        shell: bash
        env:
          OLD_VERSION: ${{ steps.baseline.outputs.version }}
          OLD_MS: ${{ steps.baseline.outputs.milliseconds }}
          NEW_VERSION: ${{ steps.typescript7.outputs.version }}
          NEW_MS: ${{ steps.typescript7.outputs.milliseconds }}
        run: |
          set -euo pipefail
          BUNDLE_BYTES="$(stat -c%s custom_components/argus/www/react-dist/argus-dashboard-react.js)"
          python - "$OLD_VERSION" "$OLD_MS" "$NEW_VERSION" "$NEW_MS" "$BUNDLE_BYTES" <<'PY'
          import pathlib
          import sys
          old_version, old_ms, new_version, new_ms, bundle_bytes = sys.argv[1:]
          pathlib.Path('docs/TYPESCRIPT_7_MIGRATION.md').write_text(
              '# TypeScript 7 migration metrics\n\n'
              f'- Baseline compiler: `{old_version}`\n'
              f'- Baseline type-check: `{old_ms} ms`\n'
              f'- Migrated compiler: `{new_version}`\n'
              f'- TypeScript 7 type-check: `{new_ms} ms`\n'
              f'- Production bundle: `{bundle_bytes} bytes`\n\n'
              'Times are from the same GitHub Actions runner and are intended as a small-project comparison, not a universal benchmark.\n',
              encoding='utf-8',
          )
          PY
          cat docs/TYPESCRIPT_7_MIGRATION.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit validated migration
        run: |
          set -euo pipefail
          rm .github/workflows/migrate-typescript-7-once.yml
          git config user.name 'Chrisalvir'
          git config user.email 'chrisalvir01@gmail.com'
          git add package.json package-lock.json custom_components/argus/www/react-dist/argus-dashboard-react.js docs/TYPESCRIPT_7_MIGRATION.md .github/workflows/migrate-typescript-7-once.yml
          git commit -m 'Migrate dashboard compiler to TypeScript 7.0.2'
          git push origin HEAD:feature/react-dashboard-layout
