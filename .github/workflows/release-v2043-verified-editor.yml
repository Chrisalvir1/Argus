name: Release verified Argus v2.0.43 editor
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v2043-verified-editor.yml]
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Wire modern editor and final visual layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('custom_components/argus/www/argus-bootstrap.js');s=p.read_text(encoding='utf-8')
          imp="import { applyV2042Stability } from './argus-v2042-stability.js?v=2.0.42';"
          if imp not in s: raise SystemExit('v2042 import missing')
          s=s.replace(imp,imp+"\nimport { applyV2043VisualFix } from './argus-v2043-visual-fix.js?v=2.0.43';",1)
          app='applyV2042Stability(ArgusPanel);'
          if app not in s: raise SystemExit('v2042 application missing')
          s=s.replace(app,app+'\napplyV2043VisualFix(ArgusPanel);',1)
          old=".then(() => console.info('Argus native dashboard persistence active'))"
          if old not in s: raise SystemExit('disabled React marker missing')
          s=s.replace(old,".then(({ applyReactDashboardLayout }) => applyReactDashboardLayout(ArgusPanel))",1)
          p.write_text(s,encoding='utf-8')
          targets=[Path('custom_components/argus/manifest.json'),Path('custom_components/argus/const.py'),*Path('custom_components/argus/www').glob('*.js'),*Path('tests').glob('test_*.py')]
          for path in targets:
              text=path.read_text(encoding='utf-8')
              path.write_text(text.replace('2.0.42','2.0.43'),encoding='utf-8')
          PY
          rm -f .github/workflows/release-v2043-verified-editor.yml
      - name: Verify TypeScript editor first
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
          grep -q 'applyReactDashboardLayout' custom_components/argus/www/react-dist/argus-dashboard-react.js
          if grep -q 'process\.env' custom_components/argus/www/react-dist/argus-dashboard-react.js; then exit 1; fi
          for file in custom_components/argus/www/*.js custom_components/argus/www/react-dist/*.js; do node --check "$file"; done
      - name: Verify Python and integration contracts
        run: |
          python -m compileall -q custom_components/argus
          python -m unittest discover -s tests -v
          npm audit --omit=dev --audit-level=high
      - name: Package and publish only after all checks
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          find custom_components/argus -type d -name __pycache__ -prune -exec rm -rf {} +
          find custom_components/argus -type f -name '*.pyc' -delete
          cd custom_components/argus && zip -qr ../../argus.zip . -x '__pycache__/*' '*/__pycache__/*' '*.pyc' && cd ../..
          unzip -t argus.zip
          test "$(unzip -p argus.zip manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = 2.0.43
          sha256sum argus.zip > argus.zip.sha256
          git config user.name Chrisalvir
          git config user.email chrisalvir01@gmail.com
          git add -A && git commit -m 'Release Argus Home Hub v2.0.43'
          git tag -a v2.0.43 -m 'Argus Home Hub v2.0.43'
          git push origin HEAD:main && git push origin v2.0.43
          gh release create v2.0.43 argus.zip argus.zip.sha256 --title 'Argus Home Hub v2.0.43' --notes-file docs/RELEASE_NOTES_2.0.43.md
