name: Release v2.0.32 once

on:
  push:
    branches:
      - fix/mobile-background-homekit-polish
    paths:
      - .github/workflows/release-v2.0.32-once.yml

permissions:
  contents: write

jobs:
  release-v2032:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bump sources and write release notes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [Path('custom_components/argus/manifest.json'), Path('custom_components/argus/const.py')]
          targets += list(Path('custom_components/argus/www').glob('*.js'))
          targets += list(Path('tests').glob('test_*.py'))
          for path in targets:
              text = path.read_text(encoding='utf-8')
              updated = text.replace('2.0.31.1', '2.0.32').replace('2.0.31', '2.0.32')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          section = '''## [2.0.32] - 2026-08-04

          ### Fixed
          - Eliminado el destello de respaldo basado en apagados y encendidos repetidos para evitar reinicios de bombillos Matter, bombillos convencionales inteligentes y plugs.
          - Luces regulables sin flash nativo ahora pulsan únicamente el brillo entre 25% y 100%, sin cortar la alimentación lógica.
          - Luces exclusivamente `onoff` y entidades similares a plugs se mantienen encendidas de forma fija y no ofrecen destello inseguro.
          - Argus captura y restaura estado, brillo, color RGB/HS/XY, temperatura de blanco y efecto después de SOS, alarmas y pruebas.
          - Si Home Assistant no conserva el color anterior, se restaura blanco neutro para impedir que el siguiente encendido manual permanezca en rojo.
          - Valores RGB falsos se eliminan antes de guardar configuraciones para luces sin capacidad de color.

          '''
          marker = 'Todos los cambios relevantes de Argus se documentan aquí. El historial anterior continúa disponible en Git.\n\n'
          if '## [2.0.32]' not in text:
              changelog.write_text(text.replace(marker, marker + section), encoding='utf-8')

          Path('docs/RELEASE_NOTES_2.0.32.md').write_text('''# Argus Home Hub v2.0.32

          Versión de seguridad para el manejo de bombillos, destellos y restauración de color.

          ## Destello seguro
          - Se eliminó el ciclo repetido `turn_off`/`turn_on`.
          - Flash o efectos nativos se utilizan únicamente cuando Home Assistant los declara.
          - Luces regulables sin flash nativo pulsan el brillo sin apagarse.
          - Luces `onoff` y plugs permanecen encendidos de forma fija.

          ## Restauración de estado
          - Antes de una alarma se guarda estado, brillo, color, temperatura de blanco y efecto.
          - Al finalizar se restauran exactamente los valores anteriores.
          - Las luces originalmente apagadas recuperan su color previo, o blanco neutro cuando Home Assistant no conserva ese valor, antes de apagarse.
          - La prueba de destello utiliza el mismo proceso seguro de captura y restauración.

          ## Validación
          - Compilación Python completa.
          - Suite de pruebas de regresión actualizada.
          - Validación sintáctica de todos los archivos JavaScript.
          - HACS y hassfest aprobados antes de preparar la versión.

          > Después de actualizar, reinicia Home Assistant y realiza una recarga completa del navegador sin caché.
          ''', encoding='utf-8')
          PY
      - name: Validate v2.0.32
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/argus
          python -m unittest discover -s tests -v
          for file in custom_components/argus/www/*.js; do node --check "$file"; done
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('custom_components/argus/manifest.json').read_text())['version'] == '2.0.32'
          assert 'VERSION = "2.0.32"' in Path('custom_components/argus/const.py').read_text()
          assert "ARGUS_CARD_VERSION='2.0.32'" in Path('custom_components/argus/www/argus-card.js').read_text()
          assert 'argus-light-capability-fixes.js?v=2.0.32' in Path('custom_components/argus/www/argus-bootstrap.js').read_text()
          PY
      - name: Commit and push v2.0.32
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Chrisalvir'
          git config user.email 'chrisalvir01@gmail.com'
          git add CHANGELOG.md docs/RELEASE_NOTES_2.0.32.md custom_components/argus tests
          git commit -m 'Release v2.0.32 - safe light pulsing and state restoration'
          git push origin HEAD:fix/mobile-background-homekit-polish
      - name: Create tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -a v2.0.32 -m 'Argus Home Hub v2.0.32'
          git push origin v2.0.32
          cd custom_components/argus
          zip -r ../../argus.zip . -x '__pycache__/*' '*.pyc'
          cd ../..
          unzip -t argus.zip
          gh release create v2.0.32 argus.zip --title 'Argus Home Hub v2.0.32' --notes-file docs/RELEASE_NOTES_2.0.32.md
      - name: Remove one-time workflow from branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/release-v2.0.32-once.yml
          git commit -m 'chore: remove one-time v2.0.32 release workflow'
          git push origin HEAD:fix/mobile-background-homekit-polish
