name: Release v2.0.34 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v2.0.34-once.yml

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Synchronize v2.0.34 and remove stale artifacts
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          version_files = [
              root / 'custom_components/argus/manifest.json',
              root / 'custom_components/argus/const.py',
              root / 'custom_components/argus/www/argus-card.js',
              root / 'custom_components/argus/www/argus-bootstrap.js',
              *sorted((root / 'tests').glob('test_*.py')),
          ]
          updated = 0
          for path in version_files:
              text = path.read_text(encoding='utf-8')
              if '2.0.33' in text:
                  path.write_text(text.replace('2.0.33', '2.0.34'), encoding='utf-8')
                  updated += 1
          if updated < 8:
              raise SystemExit(f'Expected at least 8 synchronized version files, updated {updated}')

          panel_js = root / 'custom_components/argus/www/argus-panel.js'
          text = panel_js.read_text(encoding='utf-8')
          if 'argus-panel-v2018' not in text:
              raise SystemExit('Missing legacy custom-element marker in argus-panel.js')
          text = text.replace('argus-panel-v2018', 'argus-panel-v2034')
          text = text.replace('v2.0.18', 'v2.0.34')
          panel_js.write_text(text, encoding='utf-8')

          bootstrap = root / 'custom_components/argus/www/argus-bootstrap.js'
          text = bootstrap.read_text(encoding='utf-8')
          if "customElements.get('argus-panel-v2018')" not in text:
              raise SystemExit('Missing legacy bootstrap custom-element marker')
          bootstrap.write_text(text.replace("customElements.get('argus-panel-v2018')", "customElements.get('argus-panel-v2034')"), encoding='utf-8')

          panel_py = root / 'custom_components/argus/panel.py'
          text = panel_py.read_text(encoding='utf-8')
          if 'webcomponent_name="argus-panel-v2018"' not in text:
              raise SystemExit('Missing fixed panel registration marker')
          panel_py.write_text(text.replace('webcomponent_name="argus-panel-v2018"', 'webcomponent_name="argus-panel-v2034"'), encoding='utf-8')

          for test_name in ('test_v193_sync.py', 'test_v194_panel_flow.py'):
              path = root / 'tests' / test_name
              text = path.read_text(encoding='utf-8')
              text = text.replace('v2.0.18', 'v2.0.34').replace('argus-panel-v2018', 'argus-panel-v2034')
              path.write_text(text, encoding='utf-8')
          PY
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -f argus.zip.sha256

      - name: Validate Python and JavaScript
        run: |
          set -euo pipefail
          test "$(python -c 'import json; print(json.load(open("custom_components/argus/manifest.json"))["version"])')" = "2.0.34"
          grep -q 'VERSION = "2.0.34"' custom_components/argus/const.py
          grep -q "ARGUS_CARD_VERSION='2.0.34'" custom_components/argus/www/argus-card.js
          grep -q "customElements.get('argus-panel-v2034')" custom_components/argus/www/argus-bootstrap.js
          grep -q "customElements.define('argus-panel-v2034'" custom_components/argus/www/argus-panel.js
          grep -q 'webcomponent_name="argus-panel-v2034"' custom_components/argus/panel.py
          python -m compileall -q custom_components/argus
          python -m unittest discover -s tests -v
          for file in custom_components/argus/www/*.js; do
            node --check "$file"
          done

      - name: Validate React dashboard
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=high
          npx tsc --noEmit
          npm test
          npm run build
          git diff --exit-code -- custom_components/argus/www/react-dist/argus-dashboard-react.js

      - name: Validate HACS
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c

      - name: Build and verify HACS archive
        run: |
          set -euo pipefail
          find custom_components/argus -type d -name __pycache__ -prune -exec rm -rf {} +
          find custom_components/argus -type f -name '*.pyc' -delete
          cd custom_components/argus
          zip -qr ../../argus.zip . -x '__pycache__/*' '*/__pycache__/*' '*.pyc'
          cd ../..
          test -s argus.zip
          unzip -t argus.zip
          test "$(unzip -p argus.zip manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "2.0.34"
          if unzip -l argus.zip | grep -Eq '(__pycache__|\.pyc$)'; then
            echo 'Python cache artifacts found in release archive' >&2
            exit 1
          fi
          sha256sum argus.zip > argus.zip.sha256

      - name: Commit, tag and publish v2.0.34
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify refs/tags/v2.0.34 >/dev/null; then
            echo 'Tag v2.0.34 already exists' >&2
            exit 1
          fi
          rm .github/workflows/release-v2.0.34-once.yml
          git config user.name 'Chrisalvir'
          git config user.email 'chrisalvir01@gmail.com'
          git add -A
          git commit -m 'Release Argus Home Hub v2.0.34'
          git tag -a v2.0.34 -m 'Argus Home Hub v2.0.34'
          git push origin HEAD:main
          git push origin v2.0.34
          gh release create v2.0.34 argus.zip argus.zip.sha256 --title 'Argus Home Hub v2.0.34' --notes-file docs/RELEASE_NOTES_2.0.34.md
          gh release view v2.0.34
