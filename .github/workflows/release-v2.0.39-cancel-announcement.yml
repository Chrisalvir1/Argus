name: Release Argus v2.0.39 cancellation announcement
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v2.0.39-cancel-announcement.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Add cancellation message and event
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('custom_components/argus/const.py')
          s=c.read_text(encoding='utf-8')
          if 'CONF_ARMING_VOICE_MESSAGE_CANCELLED' not in s:
              s += '\nCONF_ARMING_VOICE_MESSAGE_CANCELLED = "arming_voice_message_cancelled"\nDEFAULT_ARMING_VOICE_MESSAGE_CANCELLED = "El armado en modo {mode} fue cancelado manualmente."\n'
          c.write_text(s.replace('VERSION = "2.0.38"','VERSION = "2.0.39"'),encoding='utf-8')

          p=Path('custom_components/argus/arming_voice.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('    DEFAULT_ARMING_VOICE_MESSAGE_COMPLETE,\n)', '    DEFAULT_ARMING_VOICE_MESSAGE_COMPLETE,\n    CONF_ARMING_VOICE_MESSAGE_CANCELLED,\n    DEFAULT_ARMING_VOICE_MESSAGE_CANCELLED,\n)')
          if 'async_announce_arming_cancelled' not in s:
              s += '''\n\nasync def async_announce_arming_cancelled(\n    hass: HomeAssistant, config_entry, *, alarm_entity_id: str, target: str, source: str\n) -> None:\n    """Announce a deliberate Off command while an arm request is pending."""\n    options = dict(config_entry.options)\n    mode_name = _MODE_NAMES.get(target, target)\n    template = options.get(CONF_ARMING_VOICE_MESSAGE_CANCELLED, DEFAULT_ARMING_VOICE_MESSAGE_CANCELLED)\n    message = _render(template, {"mode": mode_name, "home": config_entry.title, "source": source})\n    hass.bus.async_fire("argus_arming_wait_cancelled", {\n        "entry_id": config_entry.entry_id,\n        "alarm_entity_id": alarm_entity_id,\n        "mode": target,\n        "mode_name": mode_name,\n        "source": source,\n        "message": message,\n    })\n    if not options.get(CONF_ARMING_VOICE_ENABLED, False):\n        return\n    tts_entity = str(options.get(CONF_ARMING_VOICE_TTS, "") or "")\n    players = options.get(CONF_ARMING_VOICE_PLAYERS, [])\n    if not tts_entity or not isinstance(players, list) or not players or not message:\n        return\n    for player in players:\n        try:\n            await hass.services.async_call(\n                "tts", "speak",\n                {"entity_id": tts_entity, "media_player_entity_id": player, "message": message, "cache": True},\n                blocking=False,\n            )\n        except Exception:  # noqa: BLE001\n            _LOGGER.exception("Argus could not announce cancelled arming on %s", player)\n'''
          p.write_text(s,encoding='utf-8')

          p=Path('custom_components/argus/alarm_control_panel.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('from .arming_voice import async_announce_arming_wait_update', 'from .arming_voice import async_announce_arming_wait_update, async_announce_arming_cancelled')
          old='''        if self._arm_request and self._alarm_state == AlarmControlPanelState.DISARMED:\n            await self._async_cancel_arming_request("cancelled_from_off", disarm=True)\n            return'''
          new='''        if self._arm_request and self._alarm_state == AlarmControlPanelState.DISARMED:\n            request = self._arm_request\n            source = await self._get_context_user()\n            await async_announce_arming_cancelled(\n                self.hass, self._config_entry, alarm_entity_id=self.entity_id,\n                target=request["target"].value, source=source,\n            )\n            await self._async_cancel_arming_request("cancelled_from_off", disarm=True)\n            return'''
          if old not in s: raise SystemExit('manual Off block not found')
          p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('custom_components/argus/config_flow.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('    DEFAULT_ARMING_VOICE_MESSAGE_LAST, DEFAULT_ARMING_VOICE_MESSAGE_COMPLETE,\n)', '    DEFAULT_ARMING_VOICE_MESSAGE_LAST, DEFAULT_ARMING_VOICE_MESSAGE_COMPLETE,\n    CONF_ARMING_VOICE_MESSAGE_CANCELLED, DEFAULT_ARMING_VOICE_MESSAGE_CANCELLED,\n)')
          marker='''            vol.Optional(CONF_ARMING_VOICE_MESSAGE_COMPLETE, default=values.get(CONF_ARMING_VOICE_MESSAGE_COMPLETE, DEFAULT_ARMING_VOICE_MESSAGE_COMPLETE)): selector.TextSelector(selector.TextSelectorConfig(multiline=True)),'''
          addition=marker+'''\n            vol.Optional(CONF_ARMING_VOICE_MESSAGE_CANCELLED, default=values.get(CONF_ARMING_VOICE_MESSAGE_CANCELLED, DEFAULT_ARMING_VOICE_MESSAGE_CANCELLED)): selector.TextSelector(selector.TextSelectorConfig(multiline=True)),'''
          if marker not in s: raise SystemExit('message options marker not found')
          p.write_text(s.replace(marker,addition),encoding='utf-8')

          import json
          for name,label in [('strings.json','Manual cancellation message'),('translations/es.json','Mensaje de cancelación manual')]:
              path=Path('custom_components/argus')/name
              data=json.loads(path.read_text(encoding='utf-8'))
              data['options']['step']['init']['data']['arming_voice_message_cancelled']=label
              path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          for path in [Path('custom_components/argus/manifest.json'),Path('custom_components/argus/www/argus-card.js'),Path('custom_components/argus/www/argus-bootstrap.js'),Path('custom_components/argus/www/argus-panel.js'),*Path('tests').glob('test_*.py')]:
              path.write_text(path.read_text(encoding='utf-8').replace('2.0.38','2.0.39'),encoding='utf-8')
          PY
          cat > tests/test_cancel_announcement_contract.py <<'PY'
          from pathlib import Path
          import unittest
          ROOT=Path(__file__).resolve().parents[1]
          class TestCancelAnnouncementContract(unittest.TestCase):
              def test_manual_off_announces_before_cancelling(self):
                  panel=(ROOT/'custom_components/argus/alarm_control_panel.py').read_text(encoding='utf-8')
                  block=panel.split('async def async_alarm_disarm',1)[1].split('limiter_key',1)[0]
                  self.assertIn('async_announce_arming_cancelled', block)
                  self.assertIn('cancelled_from_off', block)
                  self.assertLess(block.index('async_announce_arming_cancelled'), block.index('cancelled_from_off'))
              def test_cancel_event_and_editable_message_exist(self):
                  voice=(ROOT/'custom_components/argus/arming_voice.py').read_text(encoding='utf-8')
                  flow=(ROOT/'custom_components/argus/config_flow.py').read_text(encoding='utf-8')
                  self.assertIn('argus_arming_wait_cancelled', voice)
                  self.assertIn('CONF_ARMING_VOICE_MESSAGE_CANCELLED', flow)
          PY
      - name: Validate
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npx tsc --noEmit
          npm test
          npm run build
          if grep -q 'process\.env' custom_components/argus/www/react-dist/argus-dashboard-react.js; then exit 1; fi
          python -m compileall -q custom_components/argus
          python -m unittest discover -s tests -v
          for file in custom_components/argus/www/*.js custom_components/argus/www/react-dist/*.js; do node --check "$file"; done
      - name: Package and publish
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          find custom_components/argus -type d -name __pycache__ -prune -exec rm -rf {} +
          find custom_components/argus -type f -name '*.pyc' -delete
          cd custom_components/argus && zip -qr ../../argus.zip . -x '__pycache__/*' '*/__pycache__/*' '*.pyc' && cd ../..
          unzip -t argus.zip
          test "$(unzip -p argus.zip manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = 2.0.39
          sha256sum argus.zip > argus.zip.sha256
          rm -f .github/workflows/release-v2.0.39-cancel-announcement.yml
          git config user.name Chrisalvir
          git config user.email chrisalvir01@gmail.com
          git add -A && git commit -m 'Release Argus Home Hub v2.0.39'
          git tag -a v2.0.39 -m 'Argus Home Hub v2.0.39'
          git push origin HEAD:main && git push origin v2.0.39
          gh release create v2.0.39 argus.zip argus.zip.sha256 --title 'Argus Home Hub v2.0.39' --notes-file docs/RELEASE_NOTES_2.0.39.md
