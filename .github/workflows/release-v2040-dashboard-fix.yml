name: Release Argus v2.0.40 dashboard hotfix
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v2040-dashboard-fix.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Wire hotfix and update versions
        run: |
          python - <<'PY'
          from pathlib import Path
          bootstrap=Path('custom_components/argus/www/argus-bootstrap.js')
          text=bootstrap.read_text(encoding='utf-8')
          marker="import { applyPersonalizationToggleFix } from './argus-personalization-toggle-fix.js?v=2.0.39';"
          addition=marker+"\nimport { applyV2040DashboardFixes } from './argus-v2040-dashboard-fixes.js?v=2.0.40';"
          if marker not in text: raise SystemExit('bootstrap import marker missing')
          text=text.replace(marker,addition,1)
          apply='applyPersonalizationToggleFix(ArgusPanel);'
          if apply not in text: raise SystemExit('bootstrap apply marker missing')
          text=text.replace(apply,apply+'\napplyV2040DashboardFixes(ArgusPanel);',1)
          bootstrap.write_text(text,encoding='utf-8')
          targets=[Path('custom_components/argus/manifest.json'),Path('custom_components/argus/const.py'),*Path('custom_components/argus/www').glob('*.js'),*Path('tests').glob('test_*.py')]
          for path in targets:
              value=path.read_text(encoding='utf-8')
              path.write_text(value.replace('2.0.39','2.0.40'),encoding='utf-8')
          PY
          rm -f .github/workflows/release-v2040-dashboard-fix.yml
      - name: Validate Python and contracts
        run: |
          python -m compileall -q custom_components/argus
          python -m unittest discover -s tests -v
      - name: Validate frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npx tsc --noEmit
          npm test
          npm run build
          if grep -q 'process\.env' custom_components/argus/www/react-dist/argus-dashboard-react.js; then exit 1; fi
          for file in custom_components/argus/www/*.js custom_components/argus/www/react-dist/*.js; do node --check "$file"; done
      - name: Commit tag and publish
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          find custom_components/argus -type d -name __pycache__ -prune -exec rm -rf {} +
          find custom_components/argus -type f -name '*.pyc' -delete
          cd custom_components/argus && zip -qr ../../argus.zip . -x '__pycache__/*' '*/__pycache__/*' '*.pyc' && cd ../..
          unzip -t argus.zip
          test "$(unzip -p argus.zip manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = 2.0.40
          sha256sum argus.zip > argus.zip.sha256
          git config user.name Chrisalvir
          git config user.email chrisalvir01@gmail.com
          git add -A && git commit -m 'Release Argus Home Hub v2.0.40'
          git tag -a v2.0.40 -m 'Argus Home Hub v2.0.40'
          git push origin HEAD:main && git push origin v2.0.40
          gh release create v2.0.40 argus.zip argus.zip.sha256 --title 'Argus Home Hub v2.0.40' --notes-file docs/RELEASE_NOTES_2.0.40.md
