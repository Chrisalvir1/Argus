name: Build React dashboard v2 once
on:
  push:
    branches: [feature/react-dashboard-layout]
    paths: [.github/workflows/build-react-dashboard-v2-once.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: python -m unittest tests.test_react_dashboard_layout_contract -v
      - name: Commit compiled bundle
        shell: bash
        run: |
          git rm .github/workflows/build-react-dashboard-v2-once.yml
          git config user.name Chrisalvir
          git config user.email chrisalvir01@gmail.com
          git add package-lock.json custom_components/argus/www/react-dist
          git commit -m 'Compile complete React dashboard editing bundle'
          git push origin HEAD:feature/react-dashboard-layout
