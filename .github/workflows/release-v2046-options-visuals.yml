name: Release Argus v2.0.46 voice options and visuals
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v2046-options-visuals.yml]
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Wire final visual layer, labels and version
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          b=Path('custom_components/argus/www/argus-bootstrap.js');s=b.read_text(encoding='utf-8')
          imp="import { applyV2045TriggerSensors } from './argus-v2045-trigger-sensors.js?v=2.0.45';";app='applyV2045TriggerSensors(ArgusPanel);'
          if imp not in s or app not in s:raise SystemExit('v2045 bootstrap marker missing')
          s=s.replace(imp,imp+"\nimport { applyV2046ActiveVisuals } from './argus-v2046-active-visuals.js?v=2.0.46';",1).replace(app,app+'applyV2046ActiveVisuals(ArgusPanel);',1);b.write_text(s,encoding='utf-8')
          labels={
           'strings.json':('Argus intelligent voice alerts','Manual arming cancellation message','Alarm-trigger sensor message','Additional triggered sensor message'),
           'en.json':('Argus intelligent voice alerts','Manual arming cancellation message','Alarm-trigger sensor message','Additional triggered sensor message'),
           'es.json':('Avisos inteligentes de Argus','Mensaje de cancelación manual del armado','Mensaje del sensor que disparó la alarma','Mensaje de sensor disparado adicional'),
           'fr.json':('Alertes vocales intelligentes Argus','Message d’annulation manuelle','Message du capteur ayant déclenché l’alarme','Message de capteur déclenché supplémentaire'),
           'pt.json':('Alertas de voz inteligentes Argus','Mensagem de cancelamento manual','Mensagem do sensor que disparou o alarme','Mensagem de sensor disparado adicional'),
           'it.json':('Avvisi vocali intelligenti Argus','Messaggio di annullamento manuale','Messaggio del sensore che ha attivato l’allarme','Messaggio sensore attivato aggiuntivo'),
           'zh.json':('Argus 智能语音提醒','手动取消布防消息','触发警报的传感器消息','额外触发传感器消息'),
           'ru.json':('Интеллектуальные голосовые оповещения Argus','Сообщение ручной отмены постановки','Сообщение датчика, вызвавшего тревогу','Сообщение дополнительного сработавшего датчика')}
          for name,(title,cancelled,triggered,additional) in labels.items():
           path=Path('custom_components/argus/strings.json') if name=='strings.json' else Path('custom_components/argus/translations')/name;data=json.loads(path.read_text(encoding='utf-8'));step=data.setdefault('options',{}).setdefault('step',{}).setdefault('init',{});step['title']=title;fields=step.setdefault('data',{});fields['arming_voice_message_cancelled']=cancelled;fields['arming_voice_message_triggered']=triggered;fields['arming_voice_message_additional_triggered']=additional;path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          targets=[Path('custom_components/argus/manifest.json'),Path('custom_components/argus/const.py'),*Path('custom_components/argus/www').glob('*.js'),*Path('tests').glob('test_*.py')]
          for path in targets:path.write_text(path.read_text(encoding='utf-8').replace('2.0.45','2.0.46'),encoding='utf-8')
          PY
          rm -f .github/workflows/release-v2046-options-visuals.yml
      - name: Verify voice-only options and translations
        run: |
          python -m compileall -q custom_components/argus
          python -m unittest discover -s tests -v
          grep -q 'Avisos inteligentes de Argus' custom_components/argus/translations/es.json
          grep -q 'arming_voice_message_cancelled' custom_components/argus/translations/es.json
          grep -q 'arming_voice_message_additional_triggered' custom_components/argus/config_flow.py
      - name: Verify frontend states and dashboard
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
          grep -q 'applyV2046ActiveVisuals' custom_components/argus/www/argus-bootstrap.js
          grep -q 'argusArmingShield' custom_components/argus/www/argus-v2046-active-visuals.js
          grep -q "state==='disarmed'" custom_components/argus/www/argus-v2046-active-visuals.js
          grep -q 'applyReactDashboardLayout' custom_components/argus/www/react-dist/argus-dashboard-react.js
          for file in custom_components/argus/www/*.js custom_components/argus/www/react-dist/*.js; do node --check "$file"; done
          npm audit --omit=dev --audit-level=high
      - name: Publish verified release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          find custom_components/argus -type d -name __pycache__ -prune -exec rm -rf {} +
          find custom_components/argus -type f -name '*.pyc' -delete
          cd custom_components/argus && zip -qr ../../argus.zip . -x '__pycache__/*' '*/__pycache__/*' '*.pyc' && cd ../..
          unzip -t argus.zip
          test "$(unzip -p argus.zip manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = 2.0.46
          sha256sum argus.zip > argus.zip.sha256
          git config user.name Chrisalvir
          git config user.email chrisalvir01@gmail.com
          git add -A && git commit -m 'Release Argus Home Hub v2.0.46'
          git tag -a v2.0.46 -m 'Argus Home Hub v2.0.46'
          git push origin HEAD:main && git push origin v2.0.46
          gh release create v2.0.46 argus.zip argus.zip.sha256 --title 'Argus Home Hub v2.0.46' --notes-file docs/RELEASE_NOTES_2.0.46.md
