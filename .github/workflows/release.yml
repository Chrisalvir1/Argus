name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate version and sources
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/argus/manifest.json"))["version"])')"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "${GITHUB_REF_NAME#v}" = "$VERSION"
          fi
          python -m compileall -q custom_components/argus
          python -m unittest discover -s tests -v
          for file in custom_components/argus/www/*.js; do
            node --check "$file"
          done
      - name: Build HACS archive
        run: |
          set -euo pipefail
          cd custom_components/argus
          zip -r "../../argus.zip" . -x '__pycache__/*' '*.pyc'
          cd ../..
          test -s argus.zip
          unzip -t argus.zip
      - uses: actions/upload-artifact@v4
        with:
          name: argus
          path: argus.zip
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/RELEASE_NOTES_${VERSION}.md"
          if [[ -f "$NOTES" ]]; then
            gh release create "$GITHUB_REF_NAME" argus.zip --title "Argus Home Hub $GITHUB_REF_NAME" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" argus.zip --title "Argus Home Hub $GITHUB_REF_NAME" --generate-notes
          fi
