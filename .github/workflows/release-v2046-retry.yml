name: Release Argus v2.0.46 retry
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v2046-retry.yml]
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Finalize v2.0.46
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          b=Path('custom_components/argus/www/argus-bootstrap.js');s=b.read_text();imp="import { applyV2045TriggerSensors } from './argus-v2045-trigger-sensors.js?v=2.0.45';";app='applyV2045TriggerSensors(ArgusPanel);'
          if imp not in s or app not in s:raise SystemExit('bootstrap marker missing')
          s=s.replace(imp,imp+"\nimport { applyV2046ActiveVisuals } from './argus-v2046-active-visuals.js?v=2.0.46';",1).replace(app,app+'applyV2046ActiveVisuals(ArgusPanel);',1);b.write_text(s)
          labels={'strings.json':('Argus intelligent voice alerts','Manual arming cancellation message'),'en.json':('Argus intelligent voice alerts','Manual arming cancellation message'),'es.json':('Avisos inteligentes de Argus','Mensaje de cancelación manual del armado'),'fr.json':('Alertes vocales intelligentes Argus','Message d’annulation manuelle'),'pt.json':('Alertas de voz inteligentes Argus','Mensagem de cancelamento manual'),'it.json':('Avvisi vocali intelligenti Argus','Messaggio di annullamento manuale'),'zh.json':('Argus 智能语音提醒','手动取消布防消息'),'ru.json':('Интеллектуальные голосовые оповещения Argus','Сообщение ручной отмены постановки')}
          for name,(title,cancelled) in labels.items():
           path=Path('custom_components/argus/strings.json') if name=='strings.json' else Path('custom_components/argus/translations')/name;data=json.loads(path.read_text());step=data['options']['step']['init'];step['title']=title;step['data']['arming_voice_message_cancelled']=cancelled;path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          targets=[Path('custom_components/argus/manifest.json'),Path('custom_components/argus/const.py'),*Path('custom_components/argus/www').glob('*.js'),*Path('tests').glob('test_*.py')]
          for path in targets:path.write_text(path.read_text().replace('2.0.45','2.0.46'))
          PY
          rm -f .github/workflows/release-v2046-retry.yml test_output_v2046.log
      - name: Verify or capture diagnostics
        run: |
          set +e
          python -m compileall -q custom_components/argus > /tmp/v2046.log 2>&1
          python -m unittest discover -s tests -v >> /tmp/v2046.log 2>&1
          PYSTATUS=$?
          if [ $PYSTATUS -eq 0 ]; then
            npm ci >> /tmp/v2046.log 2>&1 && npx tsc --noEmit >> /tmp/v2046.log 2>&1 && npm test >> /tmp/v2046.log 2>&1 && npm run build >> /tmp/v2046.log 2>&1
            FRONTSTATUS=$?
          else FRONTSTATUS=1; fi
          set -e
          if [ $PYSTATUS -ne 0 ] || [ $FRONTSTATUS -ne 0 ]; then
            cp /tmp/v2046.log /tmp/test_output_v2046.log
            git reset --hard HEAD
            cp /tmp/test_output_v2046.log test_output_v2046.log
            git config user.name Chrisalvir
            git config user.email chrisalvir01@gmail.com
            git add test_output_v2046.log
            git commit -m 'ci: capture v2.0.46 verification failure'
            git push origin HEAD:main
            exit 1
          fi
          grep -q 'Avisos inteligentes de Argus' custom_components/argus/translations/es.json
          grep -q 'applyV2046ActiveVisuals' custom_components/argus/www/argus-bootstrap.js
          grep -q 'argusArmingShield' custom_components/argus/www/argus-v2046-active-visuals.js
          for file in custom_components/argus/www/*.js custom_components/argus/www/react-dist/*.js; do node --check "$file"; done
          npm audit --omit=dev --audit-level=high
      - name: Publish
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          find custom_components/argus -type d -name __pycache__ -prune -exec rm -rf {} +
          find custom_components/argus -type f -name '*.pyc' -delete
          cd custom_components/argus && zip -qr ../../argus.zip . -x '__pycache__/*' '*/__pycache__/*' '*.pyc' && cd ../..
          unzip -t argus.zip
          test "$(unzip -p argus.zip manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = 2.0.46
          sha256sum argus.zip > argus.zip.sha256
          git config user.name Chrisalvir
          git config user.email chrisalvir01@gmail.com
          git add -A && git commit -m 'Release Argus Home Hub v2.0.46'
          git tag -a v2.0.46 -m 'Argus Home Hub v2.0.46'
          git push origin HEAD:main && git push origin v2.0.46
          gh release create v2.0.46 argus.zip argus.zip.sha256 --title 'Argus Home Hub v2.0.46' --notes-file docs/RELEASE_NOTES_2.0.46.md
