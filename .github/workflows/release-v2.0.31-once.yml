name: Release v2.0.31 once

on:
  push:
    branches:
      - fix/mobile-background-homekit-polish
    paths:
      - .github/workflows/release-v2.0.31-once.yml

permissions:
  contents: write

jobs:
  release-v2031:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bump sources and write release notes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path('custom_components/argus/manifest.json'),
              Path('custom_components/argus/const.py'),
          ]
          targets += list(Path('custom_components/argus/www').glob('*.js'))
          targets += list(Path('tests').glob('test_*.py'))
          for path in targets:
              text = path.read_text(encoding='utf-8')
              updated = text.replace('2.0.30.1', '2.0.31').replace('2.0.30', '2.0.31')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          section = '''## [2.0.31] - 2026-08-04

          ### Fixed
          - Detección estricta de capacidades de luces desde `supported_color_modes` de Home Assistant, sin inferencias por nombre o tipo aparente.
          - Los dimmers y luces `brightness`, `color_temp` u `onoff` ya no muestran ni guardan controles RGB.
          - Prueba física de destello desde SOS y Modos mediante servicios reales `light.turn_on` y `light.turn_off`, con flash nativo, efecto nativo o respaldo temporizado Argus.
          - Sensores compactos con diseño de píldora en vista normal, conservando el diseño de pantalla completa.
          - Contenedores de acceso, automatizaciones e historial ajustados con altura limitada y scroll interno.
          - Personalización estética avanzada cerrada por defecto y controlada por un único botón accesible, sin texto invertido ni doble evento.

          '''
          marker = 'Todos los cambios relevantes de Argus se documentan aquí. El historial anterior continúa disponible en Git.\n\n'
          if '## [2.0.31]' not in text:
              changelog.write_text(text.replace(marker, marker + section), encoding='utf-8')

          Path('docs/RELEASE_NOTES_2.0.31.md').write_text('''# Argus Home Hub v2.0.31

          Esta versión corrige la identificación de luces, incorpora verificación física del destello y refina varios contenedores del panel.

          ## Correcciones principales
          - Home Assistant es ahora la única fuente de verdad para capacidades de color.
          - Dimmers y luces blancas conservan destello, pero no muestran color.
          - Luces `hs`, `xy`, `rgb`, `rgbw` y `rgbww` mantienen color y destello.
          - Cada salida muestra los modos exactos declarados por Home Assistant.
          - Botón de prueba física que confirma si se utilizó flash nativo, efecto nativo o destello temporizado Argus.
          - Sensores en píldora compacta para la vista normal; fullscreen permanece intacto.
          - Automatizaciones e historial con altura acotada y desplazamiento interno.
          - Control de acceso ajustado al contenido.
          - Personalización estética avanzada oculta al iniciar y desplegable mediante un único control accesible.

          ## Validación
          - Compilación Python completa.
          - Suite de pruebas de regresión.
          - Validación sintáctica de todos los archivos JavaScript.
          - HACS y hassfest aprobados antes de preparar la versión.

          > Después de actualizar, reinicia Home Assistant y realiza una recarga completa del navegador sin caché.
          ''', encoding='utf-8')
          PY
      - name: Validate v2.0.31
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/argus
          python -m unittest discover -s tests -v
          for file in custom_components/argus/www/*.js; do node --check "$file"; done
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('custom_components/argus/manifest.json').read_text())['version'] == '2.0.31'
          assert 'VERSION = "2.0.31"' in Path('custom_components/argus/const.py').read_text()
          assert "ARGUS_CARD_VERSION='2.0.31'" in Path('custom_components/argus/www/argus-card.js').read_text()
          assert 'argus-personalization-toggle-fix.js?v=2.0.31' in Path('custom_components/argus/www/argus-bootstrap.js').read_text()
          PY
      - name: Commit and push v2.0.31
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Chrisalvir'
          git config user.email 'chrisalvir01@gmail.com'
          git add CHANGELOG.md docs/RELEASE_NOTES_2.0.31.md custom_components/argus tests
          git commit -m 'Release v2.0.31 - HA light truth and compact controls'
          git push origin HEAD:fix/mobile-background-homekit-polish
      - name: Create tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -a v2.0.31 -m 'Argus Home Hub v2.0.31'
          git push origin v2.0.31
          cd custom_components/argus
          zip -r ../../argus.zip . -x '__pycache__/*' '*.pyc'
          cd ../..
          unzip -t argus.zip
          gh release create v2.0.31 argus.zip --title 'Argus Home Hub v2.0.31' --notes-file docs/RELEASE_NOTES_2.0.31.md
      - name: Remove one-time workflow from branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/release-v2.0.31-once.yml
          git commit -m 'chore: remove one-time v2.0.31 release workflow'
          git push origin HEAD:fix/mobile-background-homekit-polish
