name: Release Argus v2.0.36 root fix
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v2.0.36-root-fix.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Synchronize v2.0.36
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          files=[root/'custom_components/argus/manifest.json',root/'custom_components/argus/const.py',root/'custom_components/argus/www/argus-card.js',root/'custom_components/argus/www/argus-bootstrap.js',root/'custom_components/argus/www/argus-panel.js',*sorted((root/'tests').glob('test_*.py'))]
          for p in files:
              p.write_text(p.read_text(encoding='utf-8').replace('2.0.35','2.0.36'),encoding='utf-8')
          PY
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -f argus.zip.sha256
      - name: Build browser-safe dashboard
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=high
          npx tsc --noEmit
          npm test
          npm run build
          BUNDLE=custom_components/argus/www/react-dist/argus-dashboard-react.js
          test -s "$BUNDLE"
          if grep -q 'process\.env' "$BUNDLE"; then
            echo 'Browser-unsafe Node process.env reference remains in bundle'
            exit 1
          fi
          grep -q "import('./react-dist/argus-dashboard-react.js?v=react-layout-2')" custom_components/argus/www/argus-bootstrap.js
          grep -q "optional dashboard enhancement failed" custom_components/argus/www/argus-bootstrap.js
      - name: Add permanent browser regression contract
        run: |
          cat > tests/test_browser_bundle_contract.py <<'PY'
          from pathlib import Path
          import unittest

          ROOT = Path(__file__).resolve().parents[1]
          WWW = ROOT / 'custom_components' / 'argus' / 'www'

          class TestBrowserBundleContract(unittest.TestCase):
              def test_react_bundle_has_no_node_process_environment(self):
                  bundle = (WWW / 'react-dist' / 'argus-dashboard-react.js').read_text(encoding='utf-8')
                  self.assertNotIn('process.env', bundle)

              def test_native_panel_loads_before_optional_react_enhancement(self):
                  bootstrap = (WWW / 'argus-bootstrap.js').read_text(encoding='utf-8')
                  self.assertIn("import './argus-panel.js?v=2.0.36'", bootstrap)
                  self.assertIn("import('./react-dist/argus-dashboard-react.js?v=react-layout-2')", bootstrap)
                  self.assertIn('.catch(', bootstrap)
                  self.assertLess(bootstrap.index("customElements.get('argus-panel-v2018')"), bootstrap.index("import('./react-dist/"))

          if __name__ == '__main__':
              unittest.main()
          PY
      - name: Run complete regression audit
        run: |
          set -euo pipefail
          test "$(python -c 'import json; print(json.load(open("custom_components/argus/manifest.json"))["version"])')" = '2.0.36'
          python -m compileall -q custom_components/argus
          python -m unittest discover -s tests -v
          for file in custom_components/argus/www/*.js custom_components/argus/www/react-dist/*.js; do node --check "$file"; done
      - name: Build verify and publish
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          find custom_components/argus -type d -name __pycache__ -prune -exec rm -rf {} +
          find custom_components/argus -type f -name '*.pyc' -delete
          cd custom_components/argus && zip -qr ../../argus.zip . -x '__pycache__/*' '*/__pycache__/*' '*.pyc' && cd ../..
          unzip -t argus.zip
          test "$(unzip -p argus.zip manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = '2.0.36'
          if unzip -l argus.zip | grep -Eq '(__pycache__|\.pyc$)'; then exit 1; fi
          if unzip -p argus.zip www/react-dist/argus-dashboard-react.js | grep -q 'process\.env'; then exit 1; fi
          sha256sum argus.zip > argus.zip.sha256
          rm -f .github/workflows/release-v2.0.36-root-fix.yml
          git config user.name 'Chrisalvir'
          git config user.email 'chrisalvir01@gmail.com'
          git add -A
          git commit -m 'Release Argus Home Hub v2.0.36'
          git tag -a v2.0.36 -m 'Argus Home Hub v2.0.36'
          git push origin HEAD:main
          git push origin v2.0.36
          gh release create v2.0.36 argus.zip argus.zip.sha256 --title 'Argus Home Hub v2.0.36' --notes-file docs/RELEASE_NOTES_2.0.36.md
