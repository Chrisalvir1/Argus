name: Capture v2.0.34 diagnostics once

on:
  push:
    branches:
      - fix/mobile-background-homekit-polish
    paths:
      - .github/workflows/capture-v2.0.34-diagnostics-once.yml

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-background-homekit-polish
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Capture npm audit
        run: |
          set +e
          {
            npm ci
            echo '=== NPM AUDIT PRODUCTION ==='
            npm audit --omit=dev
            echo "NPM_AUDIT_EXIT=$?"
          } > docs/NPM_AUDIT_2.0.34.txt 2>&1
          cat docs/NPM_AUDIT_2.0.34.txt
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/NPM_AUDIT_2.0.34.txt
          git commit -m 'chore: capture v2.0.34 npm audit'
          git push origin HEAD:fix/mobile-background-homekit-polish
