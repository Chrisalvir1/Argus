name: Release Argus v2.0.45 multi-sensor alarm
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v2045-multiple-trigger-sensors.yml]
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Wire multi-sensor configuration and orange alert UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          c=Path('custom_components/argus/const.py');s=c.read_text()
          s=s.replace('CONF_ARMING_VOICE_MESSAGE_TRIGGERED = "arming_voice_message_triggered"','CONF_ARMING_VOICE_MESSAGE_TRIGGERED = "arming_voice_message_triggered"\nCONF_ARMING_VOICE_MESSAGE_ADDITIONAL_TRIGGERED = "arming_voice_message_additional_triggered"',1)
          s=s.replace('DEFAULT_ARMING_VOICE_MESSAGE_TRIGGERED = "Alerta de seguridad. El sensor {sensor} disparó la alarma de Argus en modo {mode}."','DEFAULT_ARMING_VOICE_MESSAGE_TRIGGERED = "Alerta de seguridad. La alarma fue disparada por: {sensors}. Modo {mode}."\nDEFAULT_ARMING_VOICE_MESSAGE_ADDITIONAL_TRIGGERED = "Alerta adicional. También se activó {sensor}. Ya hay {count} sensores involucrados: {sensors}."',1);c.write_text(s)
          p=Path('custom_components/argus/__init__.py');s=p.read_text()
          s=s.replace('CONF_ARMING_VOICE_MESSAGE_TRIGGERED\n','CONF_ARMING_VOICE_MESSAGE_TRIGGERED,CONF_ARMING_VOICE_MESSAGE_ADDITIONAL_TRIGGERED\n',1)
          s=s.replace('"message_triggered":CONF_ARMING_VOICE_MESSAGE_TRIGGERED}', '"message_triggered":CONF_ARMING_VOICE_MESSAGE_TRIGGERED,"message_additional_triggered":CONF_ARMING_VOICE_MESSAGE_ADDITIONAL_TRIGGERED}',1)
          s=s.replace('vol.Optional("message_triggered"):str}', 'vol.Optional("message_triggered"):str,vol.Optional("message_additional_triggered"):str}',1);p.write_text(s)
          p=Path('custom_components/argus/config_flow.py');s=p.read_text()
          s=s.replace('CONF_ARMING_VOICE_MESSAGE_CANCELLED, CONF_ARMING_VOICE_MESSAGE_TRIGGERED,','CONF_ARMING_VOICE_MESSAGE_CANCELLED, CONF_ARMING_VOICE_MESSAGE_TRIGGERED,\n    CONF_ARMING_VOICE_MESSAGE_ADDITIONAL_TRIGGERED,',1)
          s=s.replace('DEFAULT_ARMING_VOICE_MESSAGE_CANCELLED, DEFAULT_ARMING_VOICE_MESSAGE_TRIGGERED,','DEFAULT_ARMING_VOICE_MESSAGE_CANCELLED, DEFAULT_ARMING_VOICE_MESSAGE_TRIGGERED,\n    DEFAULT_ARMING_VOICE_MESSAGE_ADDITIONAL_TRIGGERED,',1)
          marker='            vol.Optional(CONF_ARMING_VOICE_MESSAGE_TRIGGERED, default=values.get(CONF_ARMING_VOICE_MESSAGE_TRIGGERED, DEFAULT_ARMING_VOICE_MESSAGE_TRIGGERED)): selector.TextSelector(selector.TextSelectorConfig(multiline=True)),\n'
          if marker not in s:raise SystemExit('triggered UI marker missing')
          s=s.replace(marker,marker+'            vol.Optional(CONF_ARMING_VOICE_MESSAGE_ADDITIONAL_TRIGGERED, default=values.get(CONF_ARMING_VOICE_MESSAGE_ADDITIONAL_TRIGGERED, DEFAULT_ARMING_VOICE_MESSAGE_ADDITIONAL_TRIGGERED)): selector.TextSelector(selector.TextSelectorConfig(multiline=True)),\n',1);p.write_text(s)
          b=Path('custom_components/argus/www/argus-bootstrap.js');s=b.read_text();imp="import { applyV2043VisualFix } from './argus-v2043-visual-fix.js?v=2.0.44';";app='applyV2043VisualFix(ArgusPanel);'
          if imp not in s or app not in s:raise SystemExit('bootstrap marker missing')
          s=s.replace(imp,imp+"\nimport { applyV2045TriggerSensors } from './argus-v2045-trigger-sensors.js?v=2.0.45';",1).replace(app,app+'\napplyV2045TriggerSensors(ArgusPanel);',1);b.write_text(s)
          labels={'strings.json':'Additional triggered sensor message','en.json':'Additional triggered sensor message','es.json':'Mensaje de sensor disparado adicional','fr.json':'Message de capteur déclenché supplémentaire','pt.json':'Mensagem de sensor disparado adicional','it.json':'Messaggio sensore attivato aggiuntivo','zh.json':'额外触发传感器消息','ru.json':'Сообщение дополнительного сработавшего датчика'}
          for name,label in labels.items():
           path=Path('custom_components/argus/strings.json') if name=='strings.json' else Path('custom_components/argus/translations')/name;data=json.loads(path.read_text());data['options']['step']['init']['data']['arming_voice_message_additional_triggered']=label;path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          targets=[Path('custom_components/argus/manifest.json'),Path('custom_components/argus/const.py'),*Path('custom_components/argus/www').glob('*.js'),*Path('tests').glob('test_*.py')]
          for path in targets:path.write_text(path.read_text().replace('2.0.44','2.0.45'))
          PY
          rm -f .github/workflows/release-v2045-multiple-trigger-sensors.yml
      - name: Verify Python and multi-sensor contracts
        run: |
          python -m compileall -q custom_components/argus
          python -m unittest discover -s tests -v
          grep -q 'triggered_sensors' custom_components/argus/trigger_voice.py
          grep -q 'message_additional_triggered' custom_components/argus/__init__.py
          grep -q 'CONF_ARMING_VOICE_MESSAGE_ADDITIONAL_TRIGGERED' custom_components/argus/config_flow.py
          grep -q 'applyV2045TriggerSensors' custom_components/argus/www/argus-bootstrap.js
          grep -q '#ff8a1f' custom_components/argus/www/argus-v2045-trigger-sensors.js
      - name: Verify frontend and package integrity
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
          for file in custom_components/argus/www/*.js custom_components/argus/www/react-dist/*.js; do node --check "$file"; done
          npm audit --omit=dev --audit-level=high
      - name: Publish verified release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          find custom_components/argus -type d -name __pycache__ -prune -exec rm -rf {} +
          find custom_components/argus -type f -name '*.pyc' -delete
          cd custom_components/argus && zip -qr ../../argus.zip . -x '__pycache__/*' '*/__pycache__/*' '*.pyc' && cd ../..
          unzip -t argus.zip
          test "$(unzip -p argus.zip manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = 2.0.45
          sha256sum argus.zip > argus.zip.sha256
          git config user.name Chrisalvir
          git config user.email chrisalvir01@gmail.com
          git add -A && git commit -m 'Release Argus Home Hub v2.0.45'
          git tag -a v2.0.45 -m 'Argus Home Hub v2.0.45'
          git push origin HEAD:main && git push origin v2.0.45
          gh release create v2.0.45 argus.zip argus.zip.sha256 --title 'Argus Home Hub v2.0.45' --notes-file docs/RELEASE_NOTES_2.0.45.md
