name: Release Argus v2.0.38 HomeKit cancel
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v2.0.38-homekit-cancel.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Apply cancellation safety and version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('custom_components/argus/alarm_control_panel.py')
          s=p.read_text(encoding='utf-8')
          old='''    async def _async_cancel_arming_request(self, reason: str, *, disarm: bool = False) -> None:\n        if not self._arm_request and self._alarm_state != AlarmControlPanelState.ARMING:\n            return\n        self._cancel_timers()\n        if disarm and self._alarm_state == AlarmControlPanelState.ARMING:\n            self._alarm_state = AlarmControlPanelState.DISARMED\n            self.async_write_ha_state()\n            await self._async_mqtt_publish()\n            await self._async_persist_stable_state(reason)'''
          new='''    async def _async_cancel_arming_request(self, reason: str, *, disarm: bool = False) -> None:\n        had_request = self._arm_request is not None\n        if not had_request and self._alarm_state != AlarmControlPanelState.ARMING:\n            return\n        self._cancel_timers()\n        if disarm and (had_request or self._alarm_state == AlarmControlPanelState.ARMING):\n            self._alarm_state = AlarmControlPanelState.DISARMED\n            self.async_write_ha_state()\n            await self._async_mqtt_publish()\n            await self._async_persist_stable_state(reason)'''
          if old not in s: raise SystemExit('cancel block not found')
          s=s.replace(old,new)
          marker='''    async def async_alarm_disarm(self, code=None) -> None:\n        user_id = await self._get_context_user()'''
          replacement='''    async def async_alarm_disarm(self, code=None) -> None:\n        # HomeKit shows a pending request as Off. Off must cancel that request\n        # without a PIN because the alarm has not entered an armed state yet.\n        if self._arm_request and self._alarm_state == AlarmControlPanelState.DISARMED:\n            await self._async_cancel_arming_request("cancelled_from_off", disarm=True)\n            return\n        user_id = await self._get_context_user()'''
          if marker not in s: raise SystemExit('disarm marker not found')
          p.write_text(s.replace(marker,replacement),encoding='utf-8')
          for path in [Path('custom_components/argus/const.py'),Path('custom_components/argus/manifest.json'),Path('custom_components/argus/www/argus-card.js'),Path('custom_components/argus/www/argus-bootstrap.js'),Path('custom_components/argus/www/argus-panel.js'),*Path('tests').glob('test_*.py')]:
              path.write_text(path.read_text(encoding='utf-8').replace('2.0.37','2.0.38'),encoding='utf-8')
          PY
          cat >> tests/test_arming_voice_homekit_contract.py <<'PY'

          class TestHomeKitOffCancellationContract(unittest.TestCase):
              def test_off_cancels_pending_request_before_pin_validation(self):
                  source=(COMPONENT/'alarm_control_panel.py').read_text(encoding='utf-8')
                  disarm=source.split('async def async_alarm_disarm',1)[1].split('def _async_arm',1)[0]
                  self.assertIn('cancelled_from_off', disarm)
                  self.assertLess(disarm.index('cancelled_from_off'), disarm.index('PinAttemptLimiter'))
                  self.assertIn('had_request = self._arm_request is not None', source)
          PY
      - name: Full validation
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npx tsc --noEmit
          npm test
          npm run build
          if grep -q 'process\.env' custom_components/argus/www/react-dist/argus-dashboard-react.js; then exit 1; fi
          python -m compileall -q custom_components/argus
          python -m unittest discover -s tests -v
          for file in custom_components/argus/www/*.js custom_components/argus/www/react-dist/*.js; do node --check "$file"; done
      - name: Build verify and publish
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          find custom_components/argus -type d -name __pycache__ -prune -exec rm -rf {} +
          find custom_components/argus -type f -name '*.pyc' -delete
          cd custom_components/argus && zip -qr ../../argus.zip . -x '__pycache__/*' '*/__pycache__/*' '*.pyc' && cd ../..
          unzip -t argus.zip
          test "$(unzip -p argus.zip manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = '2.0.38'
          sha256sum argus.zip > argus.zip.sha256
          rm -f .github/workflows/release-v2.0.38-homekit-cancel.yml
          git config user.name 'Chrisalvir'; git config user.email 'chrisalvir01@gmail.com'
          git add -A && git commit -m 'Release Argus Home Hub v2.0.38'
          git tag -a v2.0.38 -m 'Argus Home Hub v2.0.38'
          git push origin HEAD:main && git push origin v2.0.38
          gh release create v2.0.38 argus.zip argus.zip.sha256 --title 'Argus Home Hub v2.0.38' --notes-file docs/RELEASE_NOTES_2.0.38.md
