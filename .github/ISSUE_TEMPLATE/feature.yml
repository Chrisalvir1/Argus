name: Propuesta de mejora
description: Sugiere una mejora concreta para Argus
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: ¿Qué necesidad no está cubierta?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solución propuesta
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
